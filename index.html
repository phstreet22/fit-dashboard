<style>
/* =====================================================================
   1. DESIGN TOKENS
   ===================================================================== */
:root {
  --bg: #07080c;
  --bg-2: #0b0d13;
  --surface: #10121a;
  --surface-2: #161924;
  --surface-3: #1d2130;
  --card: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  --border: rgba(255,255,255,.07);
  --border-strong: rgba(255,255,255,.14);

  --text: #eef0f6;
  --text-2: #b0b6c6;
  --muted: #727a8e;

  --primary: #7c6cff;
  --primary-2: #3ec9ff;
  --accent: #c8ff4d;
  --success: #2fe39a;
  --warning: #ffb547;
  --danger: #ff5c7a;
  --recovery: #36d6c3;

  --grad-primary: linear-gradient(135deg, #7c6cff 0%, #3ec9ff 100%);
  --grad-success: linear-gradient(135deg, #2fe39a 0%, #c8ff4d 100%);
  --grad-warm: linear-gradient(135deg, #ff9a4c 0%, #ff4d8d 100%);
  --grad-recovery: linear-gradient(135deg, #36d6c3 0%, #3ec9ff 100%);

  --radius-lg: 28px;
  --radius: 20px;
  --radius-sm: 13px;
  --radius-xs: 9px;

  --shadow: 0 20px 50px -20px rgba(0,0,0,.7);
  --glow: 0 10px 30px -8px rgba(124,108,255,.55);
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);

  --sidebar-w: 252px;
  --font: "Inter", "SF Pro Display", -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace;
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
/* Dezente Hintergrund-Glows */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(124,108,255,.16), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(62,201,255,.10), transparent 60%),
    radial-gradient(700px 600px at 60% 120%, rgba(47,227,154,.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a.nav-item, a.bn-item { text-decoration: none; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.i { width: 20px; height: 20px; flex-shrink: 0; }
.i-sm { width: 16px; height: 16px; }
.i-lg { width: 26px; height: 26px; }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
::selection { background: rgba(124,108,255,.4); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--primary-2); outline-offset: 2px; border-radius: 8px; }

/* =====================================================================
   APP SHELL
   ===================================================================== */
.app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--sidebar-w);
  padding: 26px 18px;
  display: flex; flex-direction: column; gap: 26px;
  background: linear-gradient(180deg, rgba(16,18,26,.85), rgba(10,11,16,.85));
  border-right: 1px solid var(--border);
  backdrop-filter: blur(20px);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--grad-primary);
  box-shadow: var(--glow);
  color: #fff;
}
.brand-name { font-weight: 800; letter-spacing: .14em; font-size: 17px; }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: -2px; }

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 0 12px 6px; }
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  color: var(--text-2);
  font-weight: 500;
  transition: background .25s, color .25s, transform .2s;
}
.nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav-item:active { transform: scale(.98); }
.nav-item.active { background: linear-gradient(90deg, rgba(124,108,255,.18), rgba(124,108,255,.04)); color: #fff; }
.nav-item.active::before {
  content: ""; position: absolute; left: -18px; top: 10px; bottom: 10px; width: 3px;
  border-radius: 0 4px 4px 0; background: var(--grad-primary);
}
.nav-item.active .i { color: var(--primary-2); }
.nav-badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(62,201,255,.14); color: var(--primary-2); }

.side-card {
  margin-top: auto;
  padding: 16px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--border);
}
.side-card .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.side-card strong { font-size: 20px; }
.side-actions { display: flex; flex-direction: column; gap: 2px; }
.link-btn { font-size: 12.5px; color: var(--muted); padding: 6px 12px; border-radius: 8px; text-align: left; display: flex; gap: 8px; align-items: center; transition: color .2s, background .2s; }
.link-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }

.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; padding: 26px 34px 60px; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 26px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.topbar h1 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 750; letter-spacing: -.02em; margin-top: 2px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box, var(--grad-primary) border-box;
  border: 2px solid transparent;
}
.timer-pill {
  display: none; align-items: center; gap: 8px;
  padding: 9px 14px; border-radius: 99px;
  background: rgba(124,108,255,.14); border: 1px solid rgba(124,108,255,.35);
  font-family: var(--mono); font-weight: 700; font-size: 14px;
  transition: transform .2s, background .2s;
}
.timer-pill.show { display: inline-flex; animation: popIn .35s var(--spring); }
.timer-pill:hover { transform: translateY(-1px); background: rgba(124,108,255,.22); }
.timer-pill .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-2); box-shadow: 0 0 0 0 rgba(62,201,255,.6); animation: pulse 1.6s infinite; }
.timer-pill.paused .pulse { animation: none; background: var(--warning); }

.view { animation: viewIn .45s var(--ease) both; }
.view.no-anim { animation: none; }

.bottom-nav { display: none; }

/* Einstellungen */
.wgroup + .wgroup { margin-top: 22px; }
.wgroup-title { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.wlist { display: flex; flex-direction: column; gap: 8px; }
.wrow {
  display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 16px; align-items: center;
  padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,.03); border: 1px solid transparent;
  transition: background .25s, border-color .25s;
}
.wrow:hover { background: rgba(255,255,255,.05); }
.wrow.custom { border-color: rgba(124,108,255,.35); background: rgba(124,108,255,.06); }
.wrow-main { min-width: 0; }
.wrow-main strong { display: block; font-weight: 650; }
.wrow-main span { font-size: 12.5px; color: var(--muted); }
.wrow-reset { font-size: 12px; color: var(--primary-2); font-weight: 600; margin-left: 8px; }
.wrow-reset:hover { text-decoration: underline; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.3); border: 1px solid var(--border); }
.seg button { padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 650; color: var(--text-2); transition: background .2s, color .2s; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.active { background: var(--grad-primary); color: #fff; }
.wbox { display: flex; align-items: center; gap: 6px; transition: opacity .2s; }
.wbox input { width: 78px; text-align: center; font-weight: 750; font-size: 16px; padding: 8px 6px; }
.wbox .icon-btn { width: 36px; height: 36px; font-size: 17px; }
.wbox .unit { font-size: 13px; color: var(--muted); font-weight: 600; width: 18px; }
.wbox.disabled { opacity: .3; pointer-events: none; }

/* =====================================================================
   GRID & CARDS
   ===================================================================== */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }

.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  overflow: hidden;
  transition: border-color .3s, transform .3s var(--ease), box-shadow .3s;
  animation: rise .55s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.card:hover { border-color: var(--border-strong); }
.card.lift:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.no-anim .card, .no-anim .day-card { animation: none; }

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.card-title { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 10px; }
.card-title .i { color: var(--primary-2); }
.card-sub { font-size: 13px; color: var(--muted); }

/* Hero */
.hero {
  padding: 30px;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(124,108,255,.32), transparent 52%),
    radial-gradient(90% 120% at 100% 100%, rgba(62,201,255,.18), transparent 55%),
    linear-gradient(180deg, #141726, #0f111a);
  border-color: rgba(124,108,255,.25);
  display: flex; gap: 28px; align-items: center; justify-content: space-between;
  min-height: 260px;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(70% 90% at 80% 50%, #000, transparent);
  pointer-events: none;
}
.hero-content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero h2 { font-size: clamp(26px, 3.2vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; }
.hero p.lead { color: var(--text-2); max-width: 520px; }
.hero-side { position: relative; z-index: 1; flex-shrink: 0; }
.hero.recovery { background:
    radial-gradient(120% 140% at 0% 0%, rgba(54,214,195,.25), transparent 52%),
    radial-gradient(90% 120% at 100% 100%, rgba(62,201,255,.14), transparent 55%),
    linear-gradient(180deg, #111a1d, #0e1216); border-color: rgba(54,214,195,.22); }
.hero.done { border-color: rgba(47,227,154,.3); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border-radius: 99px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  font-size: 13px; color: var(--text-2); font-weight: 500;
}
.chip .i { width: 15px; height: 15px; color: var(--primary-2); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 20px; border-radius: 14px;
  font-weight: 650; font-size: 14.5px;
  transition: transform .18s var(--ease), box-shadow .25s, background .25s, border-color .25s, opacity .2s;
  white-space: nowrap; user-select: none;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--grad-primary); color: #fff; box-shadow: var(--glow); }
.btn-primary:hover { box-shadow: 0 14px 36px -8px rgba(124,108,255,.75); transform: translateY(-1px); }
.btn-success { background: var(--grad-success); color: #06210f; box-shadow: 0 10px 30px -8px rgba(47,227,154,.5); }
.btn-success:hover { transform: translateY(-1px); }
.btn-ghost { background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { background: rgba(255,255,255,.09); border-color: var(--border-strong); }
.btn-danger { background: rgba(255,92,122,.12); color: var(--danger); border: 1px solid rgba(255,92,122,.3); }
.btn-lg { padding: 16px 26px; font-size: 16px; border-radius: 16px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: inline-grid; place-items: center;
  background: rgba(255,255,255,.05); border: 1px solid var(--border);
  color: var(--text-2);
  font-weight: 700; font-size: 13px;
  transition: background .2s, color .2s, transform .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
.icon-btn:active { transform: scale(.92); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
  padding: 4px 10px; border-radius: 99px;
  white-space: nowrap;
  background: rgba(255,255,255,.07); color: var(--text-2);
}
.badge .i { width: 13px; height: 13px; }
.s-done { background: rgba(47,227,154,.14); color: var(--success); }
.s-today { background: rgba(124,108,255,.18); color: #b3a9ff; }
.s-missed { background: rgba(255,92,122,.13); color: var(--danger); }
.s-skipped { background: rgba(255,255,255,.06); color: var(--muted); }
.s-upcoming { background: rgba(62,201,255,.1); color: var(--primary-2); }
.s-rest { background: rgba(255,255,255,.05); color: var(--muted); }
.s-progress { background: rgba(255,181,71,.13); color: var(--warning); }
.s-open { background: rgba(255,255,255,.06); color: var(--text-2); }

/* Progress bar */
.bar { position: relative; height: 8px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar > span {
  position: absolute; inset: 0 auto 0 0; width: var(--w, 0%);
  border-radius: inherit; background: var(--grad-primary);
  animation: fill 1.1s var(--ease) both;
  transition: width .6s var(--ease);
}
.bar.success > span { background: var(--grad-success); }
.bar.thin { height: 5px; }
.bar.thick { height: 12px; }
.no-anim .bar > span { animation: none; }

/* Progress ring */
.ring { position: relative; display: grid; place-items: center; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring-bg { fill: none; stroke: rgba(255,255,255,.07); }
.ring-fg { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1.4s var(--ease); }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label strong { font-size: 1.9em; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ring-label span { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Stat cards */
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat-icon {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 8px;
  background: rgba(124,108,255,.14); color: #a99eff;
}
.stat-icon.green { background: rgba(47,227,154,.13); color: var(--success); }
.stat-icon.warm { background: rgba(255,138,76,.14); color: #ff9a4c; }
.stat-icon.cyan { background: rgba(62,201,255,.13); color: var(--primary-2); }
.stat-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat-value { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.stat-value small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 4px; letter-spacing: 0; }
.stat-foot { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.stat-foot .up { color: var(--success); font-weight: 700; }
.stat::after {
  content: ""; position: absolute; width: 140px; height: 140px; right: -50px; top: -50px; border-radius: 50%;
  background: radial-gradient(circle, rgba(124,108,255,.18), transparent 70%); pointer-events: none;
}

/* Week strip (Dashboard) */
.week-strip { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; }
.ws-day {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 6px 12px; border-radius: 16px;
  background: rgba(255,255,255,.03); border: 1px solid var(--border);
  transition: transform .25s var(--ease), background .25s, border-color .25s;
  min-width: 0;
}
.ws-day:hover { transform: translateY(-3px); background: rgba(255,255,255,.06); border-color: var(--border-strong); }
.ws-name { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ws-num { font-size: 19px; font-weight: 750; }
.ws-dot { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--muted); }
.ws-dot .i { width: 16px; height: 16px; }
.ws-label { font-size: 11px; color: var(--text-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.ws-day.done .ws-dot { background: var(--grad-success); color: #06210f; }
.ws-day.missed .ws-dot { background: rgba(255,92,122,.15); color: var(--danger); }
.ws-day.today { border-color: rgba(124,108,255,.55); background: rgba(124,108,255,.1); box-shadow: 0 0 0 4px rgba(124,108,255,.08); }
.ws-day.today .ws-dot { background: var(--grad-primary); color: #fff; }
.ws-day.t-recovery:not(.done) .ws-dot { color: var(--recovery); }

/* Next workout */
.next-when { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--primary-2); text-transform: uppercase; letter-spacing: .08em; }
.next-title { font-size: 21px; font-weight: 750; letter-spacing: -.02em; margin: 6px 0 4px; }
.mini-list { list-style: none; margin: 16px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mini-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.03); }
.mini-list li span:last-child { color: var(--muted); font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }

/* Motivation */
.motivation {
  background:
    radial-gradient(100% 120% at 100% 0%, rgba(200,255,77,.12), transparent 55%),
    var(--card);
}
.motivation blockquote { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; line-height: 1.35; }
.status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.tone-success .card-title .i { color: var(--success); }
.tone-warning .card-title .i { color: var(--warning); }

/* =====================================================================
   PLAN VIEW
   ===================================================================== */
.week-tabs-wrap { position: sticky; top: 0; z-index: 5; margin: -6px -4px 20px; padding: 6px 4px 10px; background: linear-gradient(var(--bg) 70%, transparent); }
.week-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; scroll-behavior: smooth; }
.week-tabs::-webkit-scrollbar { display: none; }
.week-tab {
  flex-shrink: 0; position: relative;
  display: flex; flex-direction: column; gap: 7px;
  padding: 10px 16px 11px; border-radius: 14px; min-width: 104px;
  background: rgba(255,255,255,.035); border: 1px solid var(--border);
  font-size: 13.5px; font-weight: 600; color: var(--text-2); text-align: left;
  transition: background .25s, color .25s, border-color .25s, transform .2s;
}
.week-tab:hover { background: rgba(255,255,255,.07); color: var(--text); }
.week-tab.active { background: linear-gradient(135deg, rgba(124,108,255,.28), rgba(62,201,255,.12)); border-color: rgba(124,108,255,.5); color: #fff; }
.week-tab.current::after {
  content: "AKTUELL"; position: absolute; top: -7px; right: 10px;
  font-size: 9px; font-weight: 800; letter-spacing: .1em; padding: 2px 6px; border-radius: 6px;
  background: var(--grad-primary); color: #fff;
}
.wt-bar { display: block; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.wt-bar b { display: block; height: 100%; background: var(--grad-success); border-radius: inherit; transition: width .6s var(--ease); }

.week-head { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.week-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.week-head .nav-arrows { display: flex; gap: 8px; }
.week-kpis { display: flex; gap: 26px; flex-wrap: wrap; }
.kpi { display: flex; flex-direction: column; }
.kpi strong { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.kpi span { font-size: 12px; color: var(--muted); }

.day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
@media (min-width: 1500px) { .day-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.day-card {
  position: relative; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  padding: 18px; border-radius: 18px; min-height: 220px;
  background: var(--card); border: 1px solid var(--border);
  transition: transform .3s var(--ease), border-color .3s, box-shadow .3s, background .3s;
  animation: rise .5s var(--ease) both; animation-delay: calc(var(--i,0) * 45ms);
  overflow: hidden;
}
.day-card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--type-grad, var(--grad-primary)); opacity: .9;
}
.day-card:hover { transform: translateY(-4px); border-color: var(--border-strong); box-shadow: var(--shadow); }
.day-card:active { transform: translateY(-1px) scale(.99); }
.day-card.t-recovery { --type-grad: var(--grad-recovery); }
.day-card.t-optional { --type-grad: var(--grad-warm); }
.day-card.t-rest { --type-grad: linear-gradient(90deg, #3a3f52, #2a2e3c); background: rgba(255,255,255,.015); }
.day-card.is-today { border-color: rgba(124,108,255,.6); box-shadow: 0 0 0 4px rgba(124,108,255,.1), var(--shadow); }
.day-card.s-done-card { background: linear-gradient(180deg, rgba(47,227,154,.07), rgba(47,227,154,.01)); border-color: rgba(47,227,154,.22); }
.day-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.day-name { font-weight: 700; font-size: 14px; display: block; }
.day-date { font-size: 12px; color: var(--muted); }
.day-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(124,108,255,.13); color: #a99eff; margin-top: 4px; }
.t-recovery .day-icon { background: rgba(54,214,195,.12); color: var(--recovery); }
.t-optional .day-icon { background: rgba(255,138,76,.12); color: #ff9a4c; }
.t-rest .day-icon { background: rgba(255,255,255,.05); color: var(--muted); }
.day-card h3 { font-size: 15.5px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
.day-card p { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.day-meta { margin-top: auto; display: flex; gap: 12px; font-size: 12px; color: var(--text-2); }
.day-meta span { display: inline-flex; align-items: center; gap: 5px; }
.day-meta .i { width: 14px; height: 14px; color: var(--muted); }

/* =====================================================================
   EXERCISES (Modal & Today)
   ===================================================================== */
.check {
  width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px;
  display: grid; place-items: center;
  border: 2px solid rgba(255,255,255,.18);
  color: transparent;
  transition: background .25s, border-color .25s, color .2s, transform .2s var(--spring);
}
.check:hover { border-color: var(--success); }
.check:active { transform: scale(.85); }
.check .i { width: 18px; height: 18px; stroke-width: 3; }
.check.checked { background: var(--grad-success); border-color: transparent; color: #06210f; }
.check.pop { animation: checkPop .45s var(--spring); }
.check.sm { width: 28px; height: 28px; border-radius: 9px; }

.ex-list { display: flex; flex-direction: column; gap: 12px; }
.ex {
  border-radius: 16px; padding: 16px;
  background: rgba(255,255,255,.03); border: 1px solid var(--border);
  transition: background .3s, border-color .3s, opacity .3s;
}
.ex.is-done { background: rgba(47,227,154,.05); border-color: rgba(47,227,154,.2); }
.ex.is-done h4 { color: var(--text-2); }
.ex-head { display: flex; align-items: center; gap: 14px; }
.ex-title { flex: 1; min-width: 0; }
.ex-title h4 { font-size: 16px; font-weight: 700; transition: color .3s; }
.ex-target { font-size: 12.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
.ex-plan-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 13px; color: var(--text-2); background: rgba(124,108,255,.07); border-radius: 10px; padding: 9px 12px; }
.ex-plan-note .i { width: 15px; height: 15px; margin-top: 2px; color: #a99eff; }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; }
.spec { background: rgba(0,0,0,.22); border: 1px solid var(--border); border-radius: 13px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.spec span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.spec strong { font-size: 17px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.specs.big { margin: 0 0 22px; }
.specs.big .spec { padding: 16px; border-radius: 16px; text-align: center; }
.specs.big .spec strong { font-size: 26px; letter-spacing: -.02em; }
.sets-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.input, .field input, .field select, textarea.input {
  width: 100%;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 10px 12px;
  font-size: 14.5px; font-weight: 600;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input:focus, .field input:focus, .field select:focus, textarea.input:focus { border-color: rgba(124,108,255,.7); box-shadow: 0 0 0 4px rgba(124,108,255,.15); background: rgba(0,0,0,.35); }
textarea.input { resize: vertical; min-height: 44px; font-weight: 450; font-size: 13.5px; line-height: 1.45; margin-top: 10px; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
select.input, .field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
select option { background: var(--surface-2); }

.set-dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.set-dot {
  width: 26px; height: 26px; border-radius: 8px;
  border: 2px solid rgba(255,255,255,.15);
  font-size: 11px; font-weight: 800; color: var(--muted);
  display: grid; place-items: center;
  transition: background .2s, border-color .2s, transform .2s var(--spring), color .2s;
}
.set-dot:hover { border-color: var(--success); transform: scale(1.08); }
.set-dot.on { background: var(--grad-success); border-color: transparent; color: #06210f; }

.ex-row {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 14px; border-radius: 14px;
  background: rgba(255,255,255,.03); border: 1px solid transparent;
  transition: background .25s, border-color .25s;
}
.ex-row:hover { background: rgba(255,255,255,.055); border-color: var(--border); }
.ex-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ex-row-main strong { font-weight: 650; font-size: 15px; transition: color .3s; }
.ex-row-main span { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
.ex-row.is-done strong { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(47,227,154,.6); }
.ex-row-sets { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text-2); padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,.05); }
.ex-row.is-done .ex-row-sets { color: var(--success); background: rgba(47,227,154,.1); }

/* =====================================================================
   MODAL
   ===================================================================== */
.modal-root { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; visibility: hidden; pointer-events: none; }
.modal-root.open { visibility: visible; pointer-events: auto; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(3,4,8,.7); backdrop-filter: blur(8px); opacity: 0; transition: opacity .3s; }
.modal-root.open .modal-backdrop { opacity: 1; }
.modal {
  position: relative; width: min(860px, 100%); max-height: min(92vh, 980px);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #151826, #0e1018);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  box-shadow: 0 40px 120px -20px rgba(0,0,0,.85);
  transform: translateY(24px) scale(.97); opacity: 0;
  transition: transform .4s var(--ease), opacity .3s;
}
.modal-root.open .modal { transform: none; opacity: 1; }
.modal-head { padding: 24px 26px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
.modal-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.modal-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.modal-body { padding: 20px 26px; overflow-y: auto; overscroll-behavior: contain; }
.modal-foot { padding: 16px 26px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.modal-foot .grow { flex: 1; }
.progress-line { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
.progress-line .bar { flex: 1; }
.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }

/* =====================================================================
   FOCUS MODE
   ===================================================================== */
.focus-root {
  position: fixed; inset: 0; z-index: 60;
  background:
    radial-gradient(900px 600px at 20% -10%, rgba(124,108,255,.22), transparent 60%),
    radial-gradient(700px 500px at 110% 110%, rgba(62,201,255,.14), transparent 60%),
    var(--bg);
  overflow-y: auto;
  visibility: hidden; opacity: 0; transform: scale(1.02);
  transition: opacity .35s, transform .45s var(--ease), visibility .35s;
}
.focus-root.open { visibility: visible; opacity: 1; transform: none; }
.focus-shell { max-width: 1180px; margin: 0 auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.focus-head { display: flex; align-items: center; gap: 16px; }
.focus-head .title { flex: 1; min-width: 0; }
.focus-head h2 { font-size: 20px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.focus-count { font-family: var(--mono); font-weight: 700; color: var(--text-2); font-size: 14px; }
.focus-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.focus-strip::-webkit-scrollbar { display: none; }
.fx-chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 8px; border-radius: 99px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: background .25s, border-color .25s, color .25s;
}
.fx-chip:hover { background: rgba(255,255,255,.08); }
.fx-num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 11px; font-weight: 800; }
.fx-num .i { width: 13px; height: 13px; stroke-width: 3; }
.fx-chip.done .fx-num { background: var(--grad-success); color: #06210f; }
.fx-chip.active { border-color: rgba(124,108,255,.6); background: rgba(124,108,255,.16); color: #fff; }
.fx-chip.active .fx-num { background: var(--grad-primary); color: #fff; }

.focus-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.focus-card { padding: 30px; animation: slideIn .45s var(--ease) both; }
.focus-card h1 { font-size: clamp(30px, 4.4vw, 52px); font-weight: 850; letter-spacing: -.035em; line-height: 1.04; margin: 6px 0 14px; }
.big-sets { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.big-sets strong { font-size: 64px; font-weight: 850; line-height: 1; letter-spacing: -.04em; background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; color: transparent; }
.big-sets span { font-size: 22px; color: var(--muted); font-weight: 700; }
.focus-sets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.focus-sets .set-dot { width: 46px; height: 46px; border-radius: 14px; font-size: 15px; }
.focus-foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: auto; }

.finish { text-align: center; max-width: 620px; margin: 6vh auto 0; display: flex; flex-direction: column; align-items: center; gap: 16px; animation: popIn .6s var(--spring) both; }
.finish-badge { width: 110px; height: 110px; border-radius: 34px; display: grid; place-items: center; background: var(--grad-success); color: #06210f; box-shadow: 0 20px 60px -10px rgba(47,227,154,.55); }
.finish-badge .i { width: 54px; height: 54px; }
.finish h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 850; letter-spacing: -.03em; }
.finish-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; margin: 12px 0; }
.finish-stats .card { padding: 16px; text-align: center; }
.finish-stats strong { display: block; font-size: 24px; font-weight: 800; }
.finish-stats span { font-size: 12px; color: var(--muted); }

/* =====================================================================
   TIMER
   ===================================================================== */
.timer-widget { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.timer-ring { position: relative; }
.timer-ring svg { width: 100%; height: 100%; display: block; }
.timer-fg { transition: stroke-dashoffset .25s linear; }
.timer-widget.ending .timer-fg { stroke: url(#gradWarm); }
.timer-widget.finished .timer-fg { stroke: url(#gradSuccess); }
.timer-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.timer-text { font-family: var(--mono); font-weight: 800; font-size: 3.2em; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-sub { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-top: 8px; font-weight: 700; }
.timer-widget.running .timer-sub { color: var(--primary-2); }
.timer-widget.finished .timer-sub { color: var(--success); }
.timer-widget.finished .timer-ring { animation: ringPulse 1s ease 2; }
.timer-controls { display: flex; align-items: center; gap: 12px; }
.btn-round {
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--grad-primary); color: #fff; box-shadow: var(--glow);
  transition: transform .2s var(--spring), box-shadow .25s;
}
.btn-round:hover { transform: scale(1.06); }
.btn-round:active { transform: scale(.92); }
.btn-round .i { width: 26px; height: 26px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.preset {
  padding: 8px 14px; border-radius: 11px; font-weight: 700; font-size: 13px; font-family: var(--mono);
  background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text-2);
  transition: background .2s, color .2s, border-color .2s, transform .15s;
}
.preset:hover { background: rgba(255,255,255,.1); color: var(--text); }
.preset:active { transform: scale(.94); }
.preset.active { background: rgba(124,108,255,.2); border-color: rgba(124,108,255,.55); color: #fff; }
.timer-widget.compact { gap: 14px; }
.timer-widget.compact .timer-text { font-size: 2.4em; }
.timer-widget.compact .btn-round { width: 54px; height: 54px; }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.switch { width: 46px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.12); position: relative; transition: background .25s; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .3s var(--spring); }
.switch.on { background: var(--grad-primary); }
.switch.on::after { transform: translateX(20px); }

.rest-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rest-table td { padding: 11px 0; border-bottom: 1px solid var(--border); }
.rest-table td:last-child { text-align: right; font-family: var(--mono); color: var(--text-2); }

/* =====================================================================
   CHARTS
   ===================================================================== */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.grid-line { stroke: rgba(255,255,255,.06); stroke-dasharray: 3 5; }
.axis-label { fill: var(--muted); font-size: 12px; text-anchor: middle; font-family: var(--font); }
.axis-label.hl { fill: #fff; font-weight: 700; }
.axis-y { fill: var(--muted); font-size: 11px; text-anchor: end; font-family: var(--font); }
.bar-bg { fill: rgba(255,255,255,.05); }
.bar-fg { transform-box: fill-box; transform-origin: bottom; animation: barGrow .9s var(--ease) both; transition: opacity .2s; }
.bar-fg:hover { opacity: .8; }
.bar-val { fill: var(--text-2); font-size: 11.5px; text-anchor: middle; font-weight: 700; font-family: var(--font); }
.line-path { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s var(--ease) forwards; }
.line-dashed { fill: none; stroke-width: 2; stroke-dasharray: 6 6; opacity: .55; animation: fadeIn 1s ease both; }
.line-area { animation: fadeIn 1.2s ease both; }
.line-dot { stroke: var(--bg); stroke-width: 3; transition: r .2s; }
.line-dot:hover { r: 7; }
.no-anim .bar-fg, .no-anim .line-path { animation: none; stroke-dashoffset: 0; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
.chart-legend i { width: 12px; height: 4px; border-radius: 3px; display: inline-block; }
.chart-empty { display: grid; place-items: center; text-align: center; gap: 8px; padding: 40px 10px; color: var(--muted); font-size: 14px; }
.chart-empty .i { width: 30px; height: 30px; }

.rings-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 20px; }
.ring-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.ring-card h3 { font-size: 14px; font-weight: 650; }
.ring-card p { font-size: 12.5px; color: var(--muted); }

.week-bars { display: flex; flex-direction: column; gap: 12px; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 40px 20px; }

.toast-stack { position: fixed; z-index: 100; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }

<script>
'use strict';

/* =======================================================================
   3.1 KONFIGURATION
   ======================================================================= */
const PLAN_CONFIG = {
  appName: 'Mein Training',
  planName: 'Kräftig & beweglich',
  athlete: 'Margit',            // Name für Begrüßung & Avatar
  // Startdatum des Plans (JJJJ-MM-TT). Die erste Woche beginnt am Montag davor;

  // Zum Testen ein anderes "Heute" erzwingen, z. B. per URL: index.html?heute=2027-01-12
  debugToday: (() => { try { const v = new URLSearchParams(location.search).get('heute'); return /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : null; } catch { return null; } })(),
  weightUnit: 'kg'
};

// Etappenziele (Dashboard-Karte). week = Planwoche, in der das Ziel liegt (null = nach Planende).
const GOALS = [
  { title: 'Wings for Life World Run', sub: '10 km · Mai 2027 (genaues Datum folgt)', week: 20, icon: 'flag' },
  { title: 'Bergtour Giglachseen', sub: 'über den Duisitzkarsee · Sommer 2027', week: null, icon: 'trend' },
  { title: 'Wolfgangseelauf', sub: '10 km · Oktober 2027 (langfristig)', week: null, icon: 'award' }
];

// ========================================

// ========================================
const trainingPlan = buildPlan();
// ========================================
// ENDE TRAININGSPLAN
// ========================================


/* =======================================================================
   3.3 PLAN-GENERATOR
   Setzt den 26-Wochen-Plan (Version 2) aus den Tabellen des Plans zusammen.
   Wochenstruktur: Mo Kraft A · Di Lauf-Geh · Mi Beweglichkeit · Do Kraft B ·
   Fr Spaß-Einheit (optional) · Sa Ausdauer lang · So Ruhetag.
   ======================================================================= */
function buildPlan() {
  const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  const TEST_WEEKS = [1, 7, 14, 21, 26];
  const RECOVERY_WEEKS = [7, 14, 21];

  // Phase je Woche (0 = Einstieg, 1 = Aufbau, 2 = Kraft & Lauf, 3 = Sommerform) – Erholungswochen gehören zur Phase davor
  const phaseIdx = w => w <= 7 ? 0 : w <= 14 ? 1 : w <= 21 ? 2 : 3;
  const PHASE_NAMES = ['Phase 1 · Einstieg', 'Phase 2 · Aufbau', 'Phase 3 · Kraft & Lauf', 'Phase 4 · Sommerform'];
  const PHASE_FOCUS = [
    'Technik lernen, Routine aufbauen, Gelenke an Belastung gewöhnen',
    '3 Sätze, mehr Gewicht, längere Laufabschnitte',
    'Schwerere Gewichte, Langhantel, Vorbereitung Wings for Life',
    'Kraft halten und steigern, Bergwandern für die Giglachseen'
  ];

  // Sätze × Wdh, Pause, RPE und Hinweis je Woche (gilt für Übungen 1–4 beider Krafteinheiten)
  const WEEK = [null,
    [2, 10, 60, 5, 'Nur Technik, leichtes Gewicht'], [2, 12, 60, 6, ''], [3, 10, 60, 6, 'Dritter Satz kommt dazu'],
    [3, 12, 60, 6, ''], [3, 12, 60, 7, 'Gewicht leicht steigern'], [3, 12, 60, 7, ''], [2, 10, 60, 6, 'Erholungswoche + Test'],
    [3, 10, 75, 7, 'Neue Varianten, mehr Gewicht'], [3, 12, 75, 7, ''], [3, 10, 75, 7, 'Gewicht steigern'], [3, 12, 75, 7, ''],
    [3, 10, 75, 8, 'Gewicht steigern'], [3, 12, 75, 8, ''], [2, 10, 60, 6, 'Erholungswoche + Test'],
    [3, 10, 90, 7, 'Langhantel-Start, leicht beginnen'], [3, 8, 90, 7, ''], [3, 10, 90, 8, ''], [4, 8, 90, 8, 'Stärkste Kraftwoche'],
    [3, 8, 90, 7, 'Laufen hat Vorrang'], [2, 8, 90, 6, 'Lauf-Woche: nur 1 Kraft-Einheit, leicht'], [2, 10, 60, 6, 'Erholungswoche + Test'],
    [3, 10, 90, 7, ''], [3, 8, 90, 8, ''], [4, 8, 90, 8, ''], [3, 10, 90, 8, ''], [2, 8, 90, 6, 'Abschluss-Test']
  ];
  const TITLES = [null,
    'Kennenlernen', 'Technik festigen', 'Dritter Satz', 'Mehr Wiederholungen', 'Gewicht steigern', 'Routine festigen', 'Erholung & Test',
    'Neue Varianten', 'Stabil werden', 'Stärker werden', 'Ausdauer ausbauen', 'Mehr Gewicht', 'Kraft festigen', 'Erholung & Test',
    'Langhantel-Start', 'Länger laufen', 'Fordernd & sauber', 'Stärkste Kraftwoche', 'Laufen hat Vorrang', 'Wings for Life', 'Erholung & Test',
    'Sommerform', 'Bergwandern', 'Kraft steigern', 'Endspurt', 'Abschluss-Test'
  ];

  // Gewichte trägt Margit im Training selbst ein. Der Plan gibt nur Startgewicht-Vorschläge (Kurzhanteln: pro Hantel).
  // wkey = gemeinsamer Schlüssel, über den das zuletzt eingetragene Gewicht in die nächsten Einheiten übernommen wird.
  const W = (wkey, hint) => ({ wkey, hint });
  const BW = { bw: true };

  const D = {
    squatBank: 'Füße schulterbreit, Gesäß nach hinten zur Bank absenken, kurz antippen (nicht absitzen), aufstehen. Knie zeigen in Richtung Fußspitzen.',
    goblet: 'Wie die Kniebeuge zur Bank, eine Kurzhantel senkrecht vor der Brust halten, Ellbogen zeigen nach unten.',
    hip: 'Oberer Rücken an der Längsseite der Bank, Füße aufgestellt. Gewicht auf dem Becken (bei Langhantel ein Polster drunter). Becken hochdrücken, oben 1 s Po anspannen. Kinn leicht zur Brust.',
    row: 'Eine Hand und ein Knie auf der Bank, Rücken gerade. Hantel zur Hüfte ziehen, Schulterblatt nach hinten-unten. Wiederholungen pro Seite.',
    step: 'Ganze Fußsohle auf die Stufe, über das vordere Bein hochdrücken, kontrolliert absteigen. Wiederholungen pro Seite. Bei Bedarf an der Wand festhalten.',
    pallof: 'Seitlich zum Kabelturm (oder Band) stehen, Griff vor der Brust. Arme gerade nach vorne drücken, 2 s halten, zurück. Der Rumpf darf sich nicht verdrehen. Wiederholungen pro Seite.',
    rdl: 'Hanteln vor den Oberschenkeln, Knie leicht gebeugt. Gesäß nach hinten schieben, Hanteln eng an den Beinen bis knapp unter die Knie führen, Rücken bleibt gerade. Hochkommen durch Po-Anspannung.',
    bench: 'Rücken auf der Bank, Füße am Boden. Hanteln über der Brust, kontrolliert senken bis die Ellbogen etwas unter der Bank sind, hochdrücken.',
    lat: 'Stange schulterbreit greifen, Brust raus, Stange zum oberen Brustbein ziehen – nie hinter den Nacken. Ohne Kabelturm: Band oben befestigen (Türanker), im Kniestand nach unten zur Brust ziehen.',
    face: 'Seil oder Band auf Gesichtshöhe. Zum Gesicht ziehen, Ellbogen hoch und nach außen, Schulterblätter zusammen. Sehr gut für Schultern und Haltung.',
    farmer: 'Je Hand eine schwere Hantel, aufrecht und mit festem Bauch gehen. Trainiert Griff, Rumpf und Tragen im Alltag.',
    deadbug: 'Rückenlage, Arme zur Decke, Beine angewinkelt in der Luft. Gegenüberliegenden Arm und Bein langsam strecken, unterer Rücken bleibt am Boden. Kopf liegt ab. Wiederholungen pro Seite.'
  };

  const STAND_UP = [null,
    'Vom Boden zur Bank aufsetzen, beide Hände auf der Bank',
    'Vom Boden zur Bank aufsetzen, nur eine Hand auf der Bank',
    'Aus dem Kniestand aufstehen, eine Hand am Knie',
    'Aus dem Kniestand aufstehen ohne Hände',
    'Aus dem Sitz am Boden aufstehen, eine Hand am Boden',
    'Aus dem Sitz am Boden aufstehen ohne Hände'
  ];
  const standStage = w => w >= 22 ? 6 : w >= 17 ? 5 : w >= 13 ? 4 : w >= 9 ? 3 : w >= 5 ? 2 : 1;

  // Rumpfübungen (Pallof Press, Dead Bug)
  const core = w => w <= 7 ? [2, 8] : w <= 13 ? [3, 10] : w === 14 ? [2, 10] : w === 21 ? [2, 12] : [3, 12];

  const WARMUP = {
    name: 'Aufwärmen', sets: 1, reps: 6, unit: 'Min', rest: 0, fixed: true, display: '5–7 Min',
    notes: '2 Min zügig auf der Stelle marschieren, Arme mitschwingen · Schulterkreisen rückwärts 10× · Hüftkreisen je Seite 10× · Katze-Kuh 8× · 8 Kniebeugen zur Bank ohne Gewicht · 10 Band-Zieher vor der Brust (Band Pull-Apart)'
  };
  const MOBILITY_NOTES = 'Katze-Kuh 8× · Kind-Position 30 s · „Buch öffnen“ je Seite 8× · Hüftbeuger-Dehnung im Halbknien je Seite 30 s · Wand-Engel 8× · Wadendehnung je Seite 30 s · Nacken sanft zur Seite neigen je Seite 3× 5 s. Ruhig atmen, nichts erzwingen.';
  const MOBILITY = { name: 'Beweglichkeits-Routine', sets: 1, reps: 10, unit: 'Min', rest: 0, fixed: true, notes: MOBILITY_NOTES };
  const FINISHERS = [
    { name: 'Finisher: Box-Runde (Piloxing-Stil)', notes: '6 × (30 s Schattenboxen – Gerade, Haken, Uppercut – 30 s locker). Füße bleiben am Boden, Arme nicht ganz durchstrecken.' },
    { name: 'Finisher: Tragen & Gehen', notes: "3 Runden: Farmer's Walk + 10 Step-ups." },
    { name: 'Finisher: Band-Zirkel', notes: '3 Runden: 12 Band Pull-Apart, 12 seitliche Schritte mit Band über den Knien, 10 Glute Bridges.' },
    { name: 'Finisher: Tanz', notes: '1–2 Lieblingslieder durchtanzen – ohne Sprünge.' }
  ].map(f => ({ ...f, sets: 1, reps: 6, unit: 'Min', rest: 0, fixed: true, display: '5–8 Min' }));

  const TESTS_STRENGTH = [
    { name: 'Test: Aufstehen vom Stuhl', sets: 1, reps: 30, unit: 'Sek', rest: 60, fixed: true, notes: 'Wie oft schaffst du es in 30 Sekunden, ohne Hände? Ergebnis unter „Fortschritt“ eintragen.' },
    { name: 'Test: Aufstehen vom Boden', sets: 1, reps: 1, rest: 60, fixed: true, display: 'Stufe 1–6', notes: 'Welche Stufe des Aufstehen-Trainings schaffst du? Ergebnis unter „Fortschritt“ eintragen.' },
    { name: 'Test: Unterarmstütz auf den Knien', sets: 1, reps: 1, rest: 60, fixed: true, display: 'max. Sekunden', notes: 'Wie viele Sekunden mit sauberer Haltung? Ergebnis unter „Fortschritt“ eintragen.' },
    { name: 'Test: Goblet Squat', sets: 1, reps: 10, rest: 90, fixed: true, display: '10 saubere Wdh.', notes: 'Mit welchem Gewicht schaffst du 10 saubere Wiederholungen? Langsam steigern, nicht ans Limit gehen.' }
  ];
  const TEST_RUN = { name: 'Test: 3 km Lauf-Geh auf Zeit', sets: 1, reps: 3, unit: 'km', rest: 0, fixed: true,
    notes: 'Flache Strecke, gleiches Prinzip wie im Training (joggen und gehen). Zeit stoppen und unter „Fortschritt“ eintragen.' };

  const main = (w, sets, reps, rest, rpe) => ({ sets, reps, rest, rpe });

  function strengthDay(kind, w) {
    const [sets, reps, rest, rpe, hint] = WEEK[w];
    const p = phaseIdx(w), i = w - 1;
    const [cs, cr] = core(w);
    const recovery = RECOVERY_WEEKS.includes(w) || w === 20;
    const base = main(w, sets, reps, rest, rpe);
    let exercises;
    if (kind === 'A') {
      exercises = [
        { key: 'squat', name: ['Kniebeuge zur Bank', 'Goblet Squat zur Bank', 'Goblet Squat (Bank tiefer)', 'Goblet Squat frei'][p], ...base, ...(p === 0 ? BW : W('squat', '6–8 kg')), notes: p === 0 ? D.squatBank : D.goblet },
        { key: 'hip', name: p < 2 ? 'Hip Thrust an der Hantelbank' : 'Hip Thrust mit Langhantel', ...base, ...(p < 2 ? W('hip-db', '8–10 kg') : W('hip-bb', 'Langhantel leicht beginnen')), notes: (p === 0 ? 'Erst mit Körpergewicht, dann mit Kurzhantel. ' : '') + D.hip },
        { key: 'row', name: 'Einarmiges Rudern an der Bank', ...base, ...W('row', '6–8 kg'), suffix: 'je Seite', notes: D.row },
        { key: 'step', name: ['Step-up (niedrige Stufe, 15–20 cm)', 'Step-up mit Kurzhanteln', 'Step-up (höhere Stufe, 25–30 cm)', 'Step-up mit Kurzhanteln (höhere Stufe)'][p], ...base, ...(p % 2 === 0 ? BW : W('step', '2 × 3 kg')), suffix: 'je Seite', notes: D.step },
        { key: 'pallof', name: 'Pallof Press (Kabel oder Band)', sets: cs, reps: cr, rest: 45, rpe: null, ...W('pallof', 'leicht'), suffix: 'je Seite', notes: D.pallof },
        { key: 'stand', name: `Aufstehen-Training · Stufe ${standStage(w)}`, sets: 1, reps: 5, rest: 0, rpe: null, fixed: true, display: '3–5 Wdh.',
          notes: `${STAND_UP[standStage(w)]}. Langsam und kontrolliert. Erst zur nächsten Stufe, wenn die aktuelle sicher klappt. Bei Knieschmerzen: Kissen unter das Knie, Stufe zurück.` }
      ];
    } else {
      const dist = [20, 30, 30, 40][p];
      exercises = [
        { key: 'rdl', name: p < 2 ? 'Rumänisches Kreuzheben (Kurzhanteln)' : 'Rumänisches Kreuzheben (Langhantel)', ...base, ...(p < 2 ? W('rdl-db', '2 × 6–8 kg') : W('rdl-bb', 'Langhantel leicht beginnen')), notes: D.rdl },
        { key: 'bench', name: p < 2 ? 'Brustpresse flach (Kurzhanteln)' : 'Brustpresse schräg (Kurzhanteln)', ...base, ...W('bench', '2 × 4–5 kg'), notes: (p >= 2 ? 'Bank leicht aufgestellt. ' : '') + D.bench },
        { key: 'lat', name: 'Latzug am Kabelturm', ...base, ...W('lat', '15–20 kg'), notes: D.lat },
        { key: 'face', name: 'Face Pull (Kabel oder Band)', ...base, ...W('face', 'leicht'), notes: D.face },
        { key: 'farmer', name: "Farmer's Walk", sets: recovery ? 3 : 4, reps: dist, unit: 'm', rest: 60, rpe: null, ...W('farmer', '2 × 8–10 kg'), notes: D.farmer + (p === 2 ? ' Diese Phase etwas schwerer.' : '') },
        { key: 'deadbug', name: 'Dead Bug', sets: cs, reps: cr, rest: 45, rpe: null, fixed: true, suffix: 'je Seite', notes: D.deadbug }
      ];
    }
    // Finisher wechselt jede Woche (abwechselnd A/B); in Erholungswochen und der Lauf-Woche: Beweglichkeit
    const finisher = recovery ? MOBILITY : FINISHERS[(2 * w + (kind === 'B' ? 1 : 0)) % FINISHERS.length];
    const test = kind === 'A' && TEST_WEEKS.includes(w);
    return {
      type: 'training',
      name: kind === 'A' ? 'Kraft A – Beine & Po' : 'Kraft B – Oberkörper & Haltung',
      focus: kind === 'A' ? 'Ganzkörper · Fokus Beine & Po' : 'Ganzkörper · Fokus Oberkörper & Haltung',
      duration: (recovery || w === 1 ? 35 : 45) + (test ? 10 : 0),
      description: [hint, test ? (w === 26 ? 'Abschluss-Test: Tests am Ende durchführen und mit Woche 1 vergleichen.' : 'Test-Woche: die Tests am Ende durchführen.') : ''].filter(Boolean).join(' · '),
      exercises: [WARMUP, ...exercises, finisher, ...(test ? TESTS_STRENGTH : [])]
    };
  }

  // Lauf-Geh-Training: [Wiederholungen, Joggen (Min), Gehen (s)]
  const RUN = { 2: [8, 1, 120], 3: [8, 1, 90], 4: [7, 1.5, 90], 5: [6, 2, 90], 6: [6, 2, 60], 7: [5, 2, 90], 8: [5, 3, 90], 9: [5, 3, 60],
    10: [4, 4, 60], 11: [4, 5, 90], 12: [4, 5, 60], 13: [3, 7, 90], 14: [3, 5, 90], 15: [3, 8, 90], 16: [3, 10, 90], 17: [2, 15, 120],
    18: [6, 5, 120], 19: [3, 10, 90], 22: [4, 8, 60], 23: [4, 8, 60], 24: [4, 8, 60], 25: [4, 8, 60], 26: [4, 8, 60] };
  const RUN_WARM = { name: 'Einlaufen: zügig gehen', sets: 1, reps: 5, unit: 'Min', rest: 0, fixed: true, notes: 'Am besten auf weichem Untergrund (Au, Ennsradweg).' };
  const RUN_COOL = { name: 'Auslaufen: locker gehen', sets: 1, reps: 5, unit: 'Min', rest: 0, fixed: true, notes: 'Tempo langsam reduzieren, danach gern kurz die Waden dehnen.' };

  function runDay(w) {
    let mainEx, total;
    if (w === 20) {
      mainEx = { name: 'Lockerer Lauf (Plaudertempo)', sets: 1, reps: 20, unit: 'Min', rest: 0, rpe: 4, fixed: true, notes: 'Lauf-Woche: ganz locker, nur die Beine bewegen. Kräfte sparen für Samstag.' };
      total = 20;
    } else if (w === 21) {
      mainEx = { name: 'Zügig gehen', sets: 1, reps: 30, unit: 'Min', rest: 0, rpe: 4, fixed: true, notes: 'Nach dem Lauf: nur zügig gehen, kein Joggen.' };
      total = 30;
    } else {
      const [n, jog, walk] = RUN[w];
      mainEx = {
        name: w === 18 ? 'Etwas zügiger joggen' : 'Joggen im Plaudertempo', sets: n, reps: jog, unit: 'Min', rest: walk, restLabel: 'Gehpause', rpe: w === 18 ? 6 : 5, fixed: true,
        notes: (w >= 22 ? '30–40 Min Lauf-Geh nach Gefühl, z. B. so. ' : '') + 'Joggen heißt: so langsam, dass du noch reden kannst. In der Gehpause zügig weitergehen – nach jedem Abschnitt startet der Timer für die Gehpause.'
      };
      total = n * (jog + walk / 60);
    }
    const test = TEST_WEEKS.includes(w) && w !== 1;
    return {
      type: 'training', name: 'Lauf-Geh-Training', focus: 'Joggen & Gehen im Wechsel',
      duration: Math.round((10 + total) / 5) * 5,
      description: 'Gehpausen sind kein Schummeln, sondern Teil der Methode. Wenn eine Woche zu schwer war: einfach wiederholen.' + (test ? ' Test-Woche: 3-km-Test statt oder nach dem Hauptteil.' : ''),
      exercises: [RUN_WARM, mainEx, RUN_COOL, ...(test ? [TEST_RUN] : [])]
    };
  }

  // Ausdauer lang (Samstag): hike = Wanderung, long = langer Lauf-Geh, berg = Bergwanderung, wfl = Wings for Life
  const LONG = [null,
    ['hike', 60], ['hike', 60], ['hike', 70], ['long', 40, '1 Min joggen / 2 Min gehen', 'Min'], ['hike', 80, 'Damberg'],
    ['long', 45, '2 Min joggen / 1:30 gehen', 'Min'], ['hike', 60, 'locker'], ['hike', 90, 'Damberg'], ['long', 5, '3 Min joggen / 1:30 gehen'],
    ['hike', 100], ['long', 6, '4 Min joggen / 1 Min gehen'], ['hike', 120, 'Damberg zweimal hinauf'], ['long', 7, '5 Min joggen / 1 Min gehen'],
    ['hike', 60, 'locker'], ['long', 7, '6 Min joggen / 1 Min gehen'], ['hike', 120], ['long', 8.5, '7 Min joggen / 1 Min gehen', 'km', '8–9 km'],
    ['long', 10, '8 Min joggen / 1 Min gehen', 'km', '10 km – Generalprobe'], ['long', 6, '8 Min joggen / 1 Min gehen'], ['wfl', 10],
    ['hike', 60, 'locker'], ['berg', 150, '2–3 h · 400–500 Hm'], ['long', 7, 'nach Gefühl', 'km', '6–8 km'], ['berg', 210, '3–4 h · 600 Hm'],
    ['long', 7, 'nach Gefühl', 'km', '6–8 km'], ['berg', 270, '4–5 h · 700+ Hm']
  ];

  function longDay(w) {
    const [kind, amount, extra, unit, display] = LONG[w];
    if (kind === 'wfl') return {
      type: 'training', name: 'Wings for Life World Run', focus: 'Etappenziel · 10 km', duration: 75,
      description: 'Genaues Datum folgt – Tag bei Bedarf tauschen. Das Catcher Car startet 30 Minuten nach dem Start. Für 10 km brauchst du ungefähr einen Schnitt von 7 Min pro km, inklusive Gehpausen. Ein ehrgeiziges Ziel – jeder Kilometer ist ein Erfolg!',
      exercises: [{ name: 'Wings for Life World Run', sets: 1, reps: 10, unit: 'km', rest: 0, fixed: true, notes: 'Langsam starten, Lauf-Geh wie im Training (8 Min joggen / 1 Min gehen). Gehpausen sind erlaubt.' }]
    };
    if (kind === 'long') {
      const isKm = (unit || 'km') === 'km';
      return {
        type: 'training', name: 'Ausdauer lang – Langer Lauf-Geh', focus: extra, duration: isKm ? Math.round(amount * 8.5 / 5) * 5 : amount,
        description: 'Joggen im Plaudertempo, Gehpausen gehören dazu. Gern mit deiner Freundin.' + (w === 18 ? ' Die Generalprobe zeigt, wo du für den Wings for Life stehst.' : ''),
        exercises: [{ name: `Langer Lauf-Geh: ${extra}`, sets: 1, reps: amount, unit: unit || 'km', rest: 0, fixed: true, display: display || null,
          notes: 'Plaudertempo: Du kannst dich in ganzen Sätzen unterhalten. Wasser mitnehmen.' }]
      };
    }
    const berg = kind === 'berg';
    return {
      type: 'training', name: berg ? 'Ausdauer lang – Bergwanderung' : 'Ausdauer lang – Wanderung',
      focus: berg ? (w === 26 ? 'Generalprobe für die Giglachseen' : 'Training für die Giglachseen') : (extra === 'Damberg' || extra === 'Damberg zweimal hinauf' ? `Mit Höhenmetern · ${extra}` : extra === 'locker' ? 'Lockere Wanderung' : 'Mit Höhenmetern, z. B. Damberg'),
      duration: amount,
      description: berg ? 'Gute Schuhe, Wasser, Jause und Regenjacke einpacken. Bergab langsam gehen – das schont die Knie.' : 'Gern mit Höhenmetern (z. B. Damberg) und mit deiner Freundin. Bequeme Schuhe, Wasser mitnehmen.',
      exercises: [{ name: berg ? 'Bergwanderung' : extra === 'locker' ? 'Lockere Wanderung' : 'Wanderung', sets: 1, reps: amount, unit: 'Min', rest: 0, fixed: true,
        display: berg ? extra : null, notes: 'Plaudertempo, Pausen sind erlaubt.' + (w === 1 ? ' Optional: unterwegs 3 km auf flacher Strecke stoppen – als Ausgangswert für den 3-km-Test.' : '') }]
    };
  }

  const mobilityDay = w => ({
    type: 'recovery', name: 'Tägliche Runde + Beweglichkeit', focus: 'Gehen · Beweglichkeit (optional)', duration: 10,
    description: 'Deine tägliche Runde (mind. 30 Min gehen) bleibt – sie ist der wichtigste Baustein fürs Abnehmen. Dazu optional 10 Min Beweglichkeit.',
    exercises: [
      { name: 'Tägliche Runde', sets: 1, reps: 30, unit: 'Min', rest: 0, fixed: true, display: 'mind. 30 Min', notes: 'Zügig gehen, wie bisher.' },
      { name: 'Katze-Kuh', sets: 1, reps: 8, rest: 0, fixed: true, notes: 'Auf allen Vieren Rücken langsam rund machen und wieder durchhängen lassen.' },
      { name: 'Kind-Position mit Armen nach vorne', sets: 1, reps: 30, unit: 'Sek', rest: 0, fixed: true, notes: 'Gesäß Richtung Fersen, Arme lang nach vorne, ruhig atmen.' },
      { name: '„Buch öffnen“ (Brustwirbelsäulen-Rotation)', sets: 1, reps: 8, rest: 0, fixed: true, suffix: 'je Seite', notes: 'In Seitenlage, Knie angewinkelt. Oberen Arm wie eine Buchseite nach hinten öffnen, Blick folgt der Hand.' },
      { name: 'Hüftbeuger-Dehnung im Halbknien', sets: 1, reps: 30, unit: 'Sek', rest: 0, fixed: true, suffix: 'je Seite', notes: 'Kissen unters Knie. Becken leicht nach vorne schieben, Po anspannen.' },
      { name: 'Wand-Engel', sets: 1, reps: 8, rest: 0, fixed: true, notes: 'Rücken an der Wand, Arme hochschieben – nur so weit wie schmerzfrei.' },
      { name: 'Wadendehnung an der Wand', sets: 1, reps: 30, unit: 'Sek', rest: 0, fixed: true, suffix: 'je Seite', notes: 'Hinteres Bein gestreckt, Ferse bleibt am Boden.' },
      { name: 'Nacken sanft dehnen', sets: 1, reps: 3, rest: 0, fixed: true, suffix: 'je Seite', notes: 'Kopf langsam zur Seite neigen, 5 s halten – sanft, ohne Druck mit der Hand.' }
    ]
  });

  const funDay = () => ({
    type: 'optional', name: 'Spaß-Einheit (optional)', focus: 'Bonus, gern mit deiner Freundin', duration: 40,
    description: 'Zählt als Bonus, nicht als Pflicht.',
    exercises: [{ name: 'Spaß-Einheit nach Wahl', sets: 1, reps: 40, unit: 'Min', rest: 0, fixed: true, display: '30–45 Min',
      notes: 'Schwimmen (ruhig, Brust oder Kraul) · Tanzen / Zumba / Piloxing / TaeBo – Sprünge durch Schritte ersetzen · Radfahren am Ennsradweg, sobald das Wetter passt.' }]
  });

  const restDay = (w, text) => ({
    type: 'rest', name: 'Ruhetag',
    description: text || (w === 26 ? 'Geschafft! Vergleiche deine Testergebnisse mit Woche 1 – und dann ab zu den Giglachseen. Glückwunsch!' : 'Ruhetag – Spazieren ist erlaubt. Schlaf, ausgewogene Ernährung und genug Wasser unterstützen deinen Fortschritt.')
  });

  const plan = [];
  for (let w = 1; w <= 26; w++) {
    const p = phaseIdx(w), rec = RECOVERY_WEEKS.includes(w);
    let days;
    if (w === 1) {
      // Woche 1 ist kurz (Fr–So) und dient zum Kennenlernen
      days = [
        { day: 'Freitag', ...strengthDay('A', 1) },
        { day: 'Samstag', ...longDay(1) },
        { day: 'Sonntag', ...restDay(1) }
      ];
    } else if (w === 20) {
      // Lauf-Woche: nur 1 Kraft-Einheit, leicht
      days = [
        { day: 'Montag', ...strengthDay('A', 20) },
        { day: 'Dienstag', ...runDay(20) },
        { day: 'Mittwoch', ...mobilityDay(20) },
        { day: 'Donnerstag', type: 'recovery', name: 'Tägliche Runde', focus: 'Lauf-Woche · kein Krafttraining', duration: 30,
          description: 'Diese Woche kein zweites Krafttraining – die Beine sollen frisch sein. Nur die tägliche Runde.' },
        { day: 'Freitag', ...restDay(20, 'Tag vor dem Lauf: ausruhen, gut essen und trinken, Startunterlagen und Kleidung herrichten.') },
        { day: 'Samstag', ...longDay(20) },
        { day: 'Sonntag', ...restDay(20, 'Erholung nach dem Lauf. Glückwunsch – egal wie weit du gekommen bist!') }
      ];
    } else {
      days = [
        { day: 'Montag', ...strengthDay('A', w) },
        { day: 'Dienstag', ...runDay(w) },
        { day: 'Mittwoch', ...mobilityDay(w) },
        { day: 'Donnerstag', ...strengthDay('B', w) },
        { day: 'Freitag', ...funDay() },
        { day: 'Samstag', ...longDay(w) },
        { day: 'Sonntag', ...restDay(w) }
      ];
    }
    plan.push({
      title: TITLES[w],
      phase: rec ? 'Erholungswoche' : PHASE_NAMES[p],
      focus: rec ? 'Weniger Sätze, Test – in der Erholung wirst du stärker' : (WEEK[w][4] || PHASE_FOCUS[p]),
      test: TEST_WEEKS.includes(w),
      days: days.sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day))
    });
  }
  return plan;
}


/* =======================================================================
   3.4 UTILITIES
   ======================================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 1) => Number(v).toLocaleString('de-DE', { maximumFractionDigits: d });
const pct = v => Math.round((v || 0) * 100);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// Datum (immer lokale Kalendertage, ohne Uhrzeit)
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const diffDays = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);   // b − a in Tagen
const cmpDay = (a, b) => Math.sign(diffDays(b, a));                                 // -1 | 0 | 1
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));

const WEEKDAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const WD_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const fmtDate = (d, opts = { day: '2-digit', month: '2-digit' }) => d.toLocaleDateString('de-DE', opts);
const fmtLong = d => d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const fmtWeight = w => w ? `${num(w, 2)} ${PLAN_CONFIG.weightUnit}` : 'Körpergew.';
const fmtLoad = ex => ex.weight ? fmtWeight(ex.weight) : (ex.load || 'Körpergew.');
const fmtRest = ex => {
  const s = ex.rest || 0;
  if (!ex.restLabel || s < 60) return `${s}s`;
  return s % 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} Min` : `${s / 60} Min`;
};

function relDay(d) {
  const n = diffDays(TODAY, d);
  if (n === 0) return 'Heute';
  if (n === 1) return 'Morgen';
  if (n === -1) return 'Gestern';
  return n > 0 ? `In ${n} Tagen` : `Vor ${-n} Tagen`;
}

// Deterministischer Zufall (für reproduzierbare Demo-Historie)
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* =======================================================================
   3.6 STORE (localStorage) – wird vor der Plan-Normalisierung geladen,
   weil das automatische Startdatum dort gespeichert wird.
   ======================================================================= */
const STORAGE_KEY = `training-dashboard:${PLAN_CONFIG.storageKey}`;

function freshState() {
  return {
    version: 1,
    days: {},        // { [dayId]: { completed, completedAt } }
    exercises: {},   // { [exId]:  { done, setsDone } }
    settings: { sound: true, weights: {} },   // weights: { [Übungsname]: { weight, bodyweight } }
    measure: {},     // { [Wochenindex]: { weight, waist, hip } }
    tests: {},       // { [Testwoche]: { chair, floor, plank, run, goblet } }
    meta: {}
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    const base = freshState();
    const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    return { ...base, ...s, days: obj(s.days), exercises: obj(s.exercises), measure: obj(s.measure), tests: obj(s.tests),
      settings: { ...base.settings, ...obj(s.settings), weights: obj(s.settings?.weights) }, meta: obj(s.meta) };
  } catch (err) {
    console.warn('Gespeicherte Daten konnten nicht gelesen werden.', err);
    return freshState();
  }
}
let saveTimeout, skipSave = false;
function save() { clearTimeout(saveTimeout); saveTimeout = setTimeout(saveNow, 200); }
function saveNow() {
  clearTimeout(saveTimeout);
  if (skipSave) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (err) { console.warn('Speichern fehlgeschlagen.', err); }
}
