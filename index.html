/* =======================================================================
   3.5 PLAN-NORMALISIERUNG
   Ergänzt jeden Tag/jede Übung um stabile IDs und ein Kalenderdatum.
   ======================================================================= */
const TODAY = PLAN_CONFIG.debugToday ? parseISO(PLAN_CONFIG.debugToday) : startOfDay(new Date());

const PLAN_START = (() => {
  if (PLAN_CONFIG.startDate && PLAN_CONFIG.startDate !== 'auto') return mondayOf(parseISO(PLAN_CONFIG.startDate));
  if (!state.meta.autoStart) { state.meta.autoStart = toISO(addDays(mondayOf(TODAY), -14)); saveNow(); }
  return parseISO(state.meta.autoStart);
})();

const DAY_BY_ID = {};
const EX_BY_ID = {};

const PLAN = trainingPlan.map((week, wi) => {
  const days = (week.days || []).map((d, di) => {
    const named = WEEKDAYS.findIndex(n => n.toLowerCase() === String(d.day || '').toLowerCase());
    const offset = named >= 0 ? named : di;
    const id = `w${wi + 1}-d${offset + 1}`;
    const type = TYPE_META[d.type] ? d.type : 'training';
    const day = {
      ...d, id, type, weekIndex: wi, offset,
      day: WEEKDAYS[offset] || d.day,
      name: d.name || TYPE_META[type].label,
      date: addDays(PLAN_START, wi * 7 + offset),
      exercises: []
    };
    day.exercises = (d.exercises || []).map((e, ei) => {
      const ex = { rest: 90, rpe: null, weight: 0, notes: '', ...e, id: `${id}-e${ei + 1}`, dayId: id, index: ei };
      ex.planWeight = ex.weight;
      EX_BY_ID[ex.id] = ex;
      return ex;
    });
    DAY_BY_ID[id] = day;
    return day;
  }).sort((a, b) => a.offset - b.offset);
  return { ...week, index: wi, days };
});

const ALL_DAYS = PLAN.flatMap(w => w.days).sort((a, b) => a.date - b.date);
const PLAN_BEGIN = ALL_DAYS[0]?.date || PLAN_START;   // erster tatsächlicher Plantag
const PLAN_END = PLAN.length ? addDays(PLAN_START, PLAN.length * 7 - 1) : PLAN_START;
const EXERCISE_NAMES = [...new Set(Object.values(EX_BY_ID).map(e => e.name))];

/* ---------- Eigene Gewichte ----------
   Margit trägt ihr Gewicht im Training selbst ein (state.exercises[id].weight).
   Ohne Eintrag gilt das zuletzt eingetragene Gewicht derselben Übung (wkey), sonst nur der Vorschlag aus dem Plan. */
const WEIGHT_KEYS = [
  { key: 'squat', label: 'Goblet Squat' }, { key: 'hip-db', label: 'Hip Thrust (Kurzhantel)' }, { key: 'hip-bb', label: 'Hip Thrust (Langhantel)' },
  { key: 'row', label: 'Einarmiges Rudern' }, { key: 'step', label: 'Step-up mit Kurzhanteln', perHand: true }, { key: 'pallof', label: 'Pallof Press' },
  { key: 'rdl-db', label: 'Rumänisches Kreuzheben (Kurzhanteln)', perHand: true }, { key: 'rdl-bb', label: 'Rumänisches Kreuzheben (Langhantel)' },
  { key: 'bench', label: 'Brustpresse', perHand: true }, { key: 'lat', label: 'Latzug' }, { key: 'face', label: 'Face Pull' }, { key: 'farmer', label: "Farmer's Walk", perHand: true }
];
const WKEY = Object.fromEntries(WEIGHT_KEYS.map(k => [k.key, k]));
const LEG_KEYS = ['squat', 'hip-db', 'hip-bb', 'step', 'rdl-db', 'rdl-bb'];
const ownWeight = ex => { const v = state.exercises[ex.id]?.weight; return v > 0 ? v : null; };

function applyOwnWeights() {
  const last = {};
  ALL_DAYS.forEach(d => d.exercises.forEach(ex => {
    if (!ex.wkey) return;
    const own = ownWeight(ex);
    if (own) { ex.weight = own; ex.weightSource = 'own'; last[ex.wkey] = own; }
    else if (last[ex.wkey]) { ex.weight = last[ex.wkey]; ex.weightSource = 'last'; }
    else { ex.weight = 0; ex.weightSource = null; }
    ex.load = ex.weight ? null : `Vorschlag ${ex.hint}`;
  }));
}
applyOwnWeights();


/* =======================================================================
   3.7 SELEKTOREN & STATISTIKEN
   ======================================================================= */
const isWorkout = d => d.type === 'training' || d.type === 'optional';
const isCompletable = d => d.type !== 'rest';
const isDayDone = d => !!state.days[d.id]?.completed;
const isExDone = ex => !!state.exercises[ex.id]?.done;

const setsDone = ex => isExDone(ex) ? ex.sets : Math.min(state.exercises[ex.id]?.setsDone || 0, ex.sets);
const unitKind = ex => {
  const u = ex.unit || '';
  return /^sek/i.test(u) ? 'sek' : /^min/i.test(u) ? 'min' : /^km$/i.test(u) ? 'km' : /^m$/i.test(u) ? 'm' : 'wdh';
};
const isTimed = ex => unitKind(ex) === 'sek' || unitKind(ex) === 'min';
const isCardio = ex => unitKind(ex) === 'min' || unitKind(ex) === 'km';
const repsUnit = ex => ({ sek: ' s', min: ' Min', km: ' km', m: ' m', wdh: '' })[unitKind(ex)];
const showsLoad = ex => !ex.fixed && !isCardio(ex);
// Umfang einer Übung als Text, z. B. "3 × 12 je Seite", "8 × 1,5 Min", "10 km"
function fmtAmount(ex) {
  if (ex.display) return ex.display;
  const v = `${num(ex.reps, 2)}${repsUnit(ex)}`;
  return (ex.sets === 1 && unitKind(ex) !== 'wdh' ? v : `${ex.sets} × ${v}`) + (ex.suffix ? ` ${ex.suffix}` : '');
}

function exStatus(ex) {
  if (isExDone(ex)) return { label: 'Erledigt', cls: 's-done' };
  const s = state.exercises[ex.id];
  if (s && (s.setsDone > 0)) return { label: 'In Arbeit', cls: 's-progress' };
  return { label: 'Offen', cls: 's-open' };
}
function exTarget(ex) {
  return [fmtAmount(ex), showsLoad(ex) ? fmtLoad(ex) : null, ex.rest > 0 ? `${fmtRest(ex)} ${ex.restLabel || 'Pause'}` : null, ex.rpe ? `RPE ${num(ex.rpe)}` : null].filter(Boolean).join(' · ');
}

const totalSets = d => d.exercises.reduce((s, ex) => s + ex.sets, 0);
const doneSets = d => d.exercises.reduce((s, ex) => s + setsDone(ex), 0);

function dayProgress(d) {
  if (isDayDone(d)) return 1;
  if (!d.exercises.length) return 0;
  const total = d.exercises.reduce((s, ex) => s + ex.sets, 0);
  return d.exercises.reduce((s, ex) => s + setsDone(ex), 0) / total;
}
function dayStatus(d) {
  if (d.type === 'rest') return 'rest';
  if (isDayDone(d)) return 'done';
  const c = cmpDay(d.date, TODAY);
  if (c === 0) return 'today';
  if (c < 0) return d.type === 'training' ? 'missed' : 'skipped';
  return 'upcoming';
}

const planNotStarted = () => cmpDay(TODAY, PLAN_BEGIN) < 0;
const planEnded = () => cmpDay(TODAY, PLAN_END) > 0;
const currentWeekIndex = () => PLAN.length ? clamp(Math.floor(diffDays(PLAN_START, TODAY) / 7), 0, PLAN.length - 1) : 0;
const todayDay = () => ALL_DAYS.find(d => cmpDay(d.date, TODAY) === 0) || null;
const nextWorkout = () => ALL_DAYS.find(d => isWorkout(d) && cmpDay(d.date, TODAY) > 0 && !isDayDone(d)) || null;

function weekStats(w) {
  const training = w.days.filter(d => d.type === 'training');
  const workouts = w.days.filter(isWorkout);
  const done = training.filter(isDayDone).length;
  return {
    training: training.length,
    done,
    workouts: workouts.length,
    workoutsDone: workouts.filter(isDayDone).length,
    progress: training.length ? done / training.length : 0,
    sets: w.days.reduce((s, d) => s + doneSets(d), 0),
    plannedSets: w.days.filter(isWorkout).reduce((s, d) => s + totalSets(d), 0)
  };
}

function globalStats() {
  const training = ALL_DAYS.filter(d => d.type === 'training');
  const workouts = ALL_DAYS.filter(isWorkout);
  const doneTraining = training.filter(isDayDone).length;
  // "fällig" = vergangene Trainings + heute, falls bereits erledigt
  const due = training.filter(d => cmpDay(d.date, TODAY) < 0 || (cmpDay(d.date, TODAY) === 0 && isDayDone(d)));
  const dueDone = due.filter(isDayDone).length;

  // Streak: aufeinanderfolgende erledigte Workouts; verpasste Pflicht-Trainings brechen die Serie,
  // ausgelassene optionale Einheiten und das heutige (noch offene) Training nicht.
  let streak = 0, best = 0;
  for (const d of workouts) {
    if (cmpDay(d.date, TODAY) > 0) break;
    if (isDayDone(d)) { streak++; best = Math.max(best, streak); }
    else if (d.type === 'training' && cmpDay(d.date, TODAY) < 0) streak = 0;
  }
  const lastDue = due[due.length - 1];
  return {
    totalTraining: training.length,
    doneTraining,
    totalWorkouts: workouts.length,
    workoutsDone: workouts.filter(isDayDone).length,
    planProgress: training.length ? doneTraining / training.length : 0,
    consistency: due.length ? dueDone / due.length : null,
    dueCount: due.length,
    missed: due.length - dueDone,
    lastMissed: lastDue ? !isDayDone(lastDue) : false,
    streak, best,
    sets: ALL_DAYS.reduce((s, d) => s + doneSets(d), 0)
  };
}

function motivation(g) {
  const t = todayDay();
  const quotes = [
    'Du musst nicht perfekt sein. Nur beständig.',
    'Stärke entsteht nicht im Training, sondern in der Erholung danach.',
    'Kleine Schritte, oft wiederholt, bringen dich bis zu den Giglachseen.',
    'Gehpausen sind kein Schummeln – sie sind Teil der Methode.',
    'Jede Einheit zählt. Auch die kurze.',
    'Entscheidend ist der Trend über einen Monat, nicht die Waage von heute.',
    'Fortschritt ist leise. Bleib dran, er wird spürbar.'
  ];
  const quote = quotes[Math.abs(diffDays(PLAN_START, TODAY)) % quotes.length];
  if (!PLAN.length) return { title: 'Kein Plan geladen', text: 'Füge deinen Trainingsplan im Code ein.', tone: 'info', quote };
  if (planNotStarted()) return { title: 'Bereit für den Start', text: `Dein Plan startet am ${fmtDate(PLAN_BEGIN, { day: 'numeric', month: 'long' })}. Nimm dir Zeit, dich in Ruhe darauf einzustellen!`, tone: 'info', quote };
  if (planEnded()) return { title: 'Plan abgeschlossen', text: `Du hast ${pct(g.planProgress)} % des Plans absolviert. Zeit für neue Ziele!`, tone: 'success', quote };
  if (t && isWorkout(t) && isDayDone(t)) return { title: 'Heute erledigt', text: 'Starke Leistung! Das heutige Training ist abgehakt. Jetzt zählen Schlaf und Ernährung.', tone: 'success', quote };
  if (g.streak >= 5) return { title: `${g.streak} Workouts in Folge`, text: 'Du bist voll im Flow. Genau diese Beständigkeit macht den Unterschied.', tone: 'success', quote };
  if (g.lastMissed) return { title: 'Zurück in den Rhythmus', text: 'Ein verpasstes Training ist kein Rückschritt. Entscheidend ist das nächste.', tone: 'warning', quote };
  if (g.consistency !== null && g.consistency >= 0.85) return { title: 'Top-Konsistenz', text: `Du hast ${pct(g.consistency)} % deiner geplanten Trainings absolviert. Weiter so!`, tone: 'success', quote };
  if (t && isWorkout(t)) return { title: 'Heute zählt', text: `${t.name} steht an. Starte mit vollem Fokus.`, tone: 'info', quote };
  return { title: 'Erholung ist Training', text: 'Regeneration ist der Moment, in dem du stärker wirst.', tone: 'info', quote };
}


/* =======================================================================
   DEMO-HISTORIE (nur beim ersten Start, wenn seedDemoProgress = true)
   ======================================================================= */
function seedDemoProgress() {
  const rnd = mulberry32(7);
  ALL_DAYS.filter(d => cmpDay(d.date, TODAY) < 0 && isCompletable(d)).forEach(d => {
    const chance = { training: 0.88, optional: 0.5, recovery: 0.7 }[d.type] ?? 0;
    if (rnd() > chance) return;
    state.days[d.id] = { completed: true, completedAt: new Date(d.date.getTime() + 18 * 36e5).toISOString() };
    d.exercises.forEach(ex => { state.exercises[ex.id] = { done: true, setsDone: ex.sets }; });
  });
  state.meta.seeded = true;
  saveNow();
}


/* =======================================================================
   3.8 UI-KOMPONENTEN
   ======================================================================= */
let ANIM = true;   // false = In-Place-Update ohne Eingangsanimationen

function ring(value, { size = 120, stroke = 10, grad = 'gradPrimary', label = '', sub = '', fontSize } = {}) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, v = clamp(value || 0, 0, 1);
  const offset = ANIM ? c : c * (1 - v);
  return `<div class="ring" style="width:${size}px;max-width:100%;aspect-ratio:1/1;font-size:${fontSize || size / 7.5}px">
    <svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="ring-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" stroke="url(#${grad})"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" data-ring="${v}" data-c="${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>
    <div class="ring-label"><strong>${label}</strong>${sub ? `<span>${sub}</span>` : ''}</div>
  </div>`;
}
function animateRings(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('[data-ring]', root).forEach(el => { el.style.strokeDashoffset = (+el.dataset.c) * (1 - (+el.dataset.ring)); });
  }));
}
function animateCounts(root) {
  $$('[data-count]', root).forEach(el => {
    const target = +el.dataset.count, dec = +(el.dataset.dec || 0), suffix = el.dataset.suffix || '';
    const t0 = performance.now(), dur = 1000;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = num(target * e, dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const count = (value, dec = 0, suffix = '') => `<span data-count="${value}" data-dec="${dec}" data-suffix="${suffix}">${num(value, dec)}${suffix}</span>`;
const bar = (value, cls = '') => `<div class="bar ${cls}"><span style="--w:${pct(value)}%"></span></div>`;
const statusBadge = st => `<span class="badge s-${st}">${STATUS_META[st].icon ? icon(STATUS_META[st].icon) : ''}${STATUS_META[st].label}</span>`;

function emptyState(iconName, title, text, actions = '') {
  return `<div class="card span-12"><div class="empty"><div class="empty-icon">${icon(iconName)}</div><h3>${title}</h3><p>${text}</p>${actions ? `<div class="actions">${actions}</div>` : ''}</div></div>`;
}

/* ---------- Charts (reines SVG) ---------- */
function barChart(items, { height = 220, fmt = v => num(v) } = {}) {
  const W = chartW(), H = isNarrow() ? Math.round(height * 0.85) : height, pt = 26, pb = 30, px = 6;
  const n = Math.max(1, items.length), slot = (W - px * 2) / n, bw = Math.min(34, slot * 0.56), ih = H - pt - pb;
  const max = Math.max(1, ...items.map(i => Math.max(i.value, i.max || 0)));
  let s = '';
  for (let g = 0; g <= 3; g++) { const y = pt + ih * g / 3; s += `<line class="grid-line" x1="${px}" x2="${W - px}" y1="${y}" y2="${y}"/>`; }
  items.forEach((it, i) => {
    const cx = px + slot * i + slot / 2, x = cx - bw / 2;
    if (it.max) { const h = ih * it.max / max; s += `<rect class="bar-bg" x="${x}" y="${pt + ih - h}" width="${bw}" height="${h}" rx="${Math.min(8, h / 2)}"/>`; }
    const h = ih * it.value / max;
    if (h > 0) s += `<rect class="bar-fg" x="${x}" y="${pt + ih - h}" width="${bw}" height="${h}" rx="${Math.min(8, h / 2)}" fill="url(#${it.grad || 'gradPrimaryV'})" style="animation-delay:${i * 50}ms"><title>${esc(it.label)}: ${fmt(it.value)}${it.max ? ' / ' + fmt(it.max) : ''}</title></rect>`;
    if (it.value > 0) s += `<text class="bar-val" x="${cx}" y="${pt + ih - h - 8}">${fmt(it.value)}</text>`;
    const hi = items.findIndex(x => x.highlight);
    if (showAxisLabel(i, n, hi)) s += `<text class="axis-label ${it.highlight ? 'hl' : ''}" x="${cx}" y="${H - 8}">${esc(n > 14 ? axisText(it.label) : it.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
}

// Bei vielen Wochen nur jede zweite Achsenbeschriftung (plus die hervorgehobene), damit sie am Handy lesbar bleibt
const showAxisLabel = (i, n, highlight) => n <= 14 || i === highlight || (i % 2 === 0 && Math.abs(i - highlight) > 1);
// Schmalere Zeichenfläche am Handy → größere, lesbare Beschriftung
const isNarrow = () => window.innerWidth < 720;
const chartW = () => isNarrow() ? 360 : 640;
const axisText = l => String(l).replace(/^W/, '');

function lineChart(labels, series, { height = 240, fmt = v => num(v), zero = false, highlight = -1, empty = 'Noch keine Daten – absolviere ein Workout, um die Entwicklung zu sehen.' } = {}) {
  const vals = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!vals.length) return `<div class="chart-empty">${icon('chart')}<span>${esc(empty)}</span></div>`;
  const W = chartW(), H = isNarrow() ? Math.round(height * 0.85) : height, pt = 20, pb = 30, pl = 54, pr = 14, iw = W - pl - pr, ih = H - pt - pb, n = labels.length;
  let min = zero ? 0 : Math.min(...vals), max = Math.max(...vals);
  if (min === max) { max += 1; min = Math.max(0, min - 1); }
  const padV = (max - min) * 0.15;
  if (!zero) min = Math.max(0, min - padV);
  max += padV;
  const X = i => pl + (n === 1 ? iw / 2 : iw * i / (n - 1));
  const Y = v => pt + ih - ih * (v - min) / (max - min);
  let s = '';
  for (let g = 0; g <= 4; g++) {
    const v = min + (max - min) * (4 - g) / 4, y = pt + ih * g / 4;
    s += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="axis-y" x="${pl - 8}" y="${y + 4}">${fmt(v)}</text>`;
  }
  labels.forEach((l, i) => { if (showAxisLabel(i, n, highlight)) s += `<text class="axis-label ${i === highlight ? 'hl' : ''}" x="${X(i)}" y="${H - 8}">${esc(n > 14 ? axisText(l) : l)}</text>`; });
  series.forEach(se => {
    // In zusammenhängende Segmente aufteilen (null = Lücke)
    const segs = []; let cur = [];
    se.values.forEach((v, i) => { if (v === null || v === undefined) { if (cur.length) segs.push(cur); cur = []; } else cur.push([X(i), Y(v), v, i]); });
    if (cur.length) segs.push(cur);
    segs.forEach(seg => {
      const d = seg.map((p, k) => `${k ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      if (se.area && seg.length > 1) s += `<path class="line-area" d="${d} L${seg[seg.length - 1][0]},${pt + ih} L${seg[0][0]},${pt + ih} Z" fill="url(#${se.area})"/>`;
      s += se.dashed
        ? `<path class="line-dashed" d="${d}" stroke="${se.color}"/>`
        : `<path class="line-path" d="${d}" stroke="${se.color}" pathLength="1"/>`;
      if (!se.dashed) seg.forEach(p => { s += `<circle class="line-dot" cx="${p[0]}" cy="${p[1]}" r="5" fill="${se.color}"><title>${esc(labels[p[3]])} · ${esc(se.name)}: ${fmt(p[2])}</title></circle>`; });
    });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
}

function heatmap() {
  let h = `<div class="heatmap" style="--cols:${PLAN.length}"><span></span>${PLAN.map((_, i) => `<span class="hm-head">W${i + 1}</span>`).join('')}`;
  for (let r = 0; r < 7; r++) {
    h += `<span class="hm-row">${WD_SHORT[r]}</span>`;
    PLAN.forEach(w => {
      const d = w.days.find(x => x.offset === r);
      if (!d) { h += '<span class="hm-cell" disabled></span>'; return; }
      const st = dayStatus(d);
      h += `<button class="hm-cell hm-${st} t-${d.type}" data-action="open-day" data-day="${d.id}" title="${esc(`${fmtDate(d.date, { weekday: 'short', day: '2-digit', month: '2-digit' })} · ${d.name} · ${STATUS_META[st].label}`)}" aria-label="${esc(d.name)}"></button>`;
    });
  }
  return h + `</div>
  <div class="hm-legend">
    <span><i style="background:var(--success)"></i>Training erledigt</span>
    <span><i style="background:#ff9a4c"></i>Optional erledigt</span>
    <span><i style="background:rgba(54,214,195,.55)"></i>Regeneration</span>
    <span><i style="background:rgba(255,92,122,.5)"></i>Verpasst</span>
    <span><i style="background:rgba(124,108,255,.14)"></i>Geplant</span>
  </div>`;
}

/* ---------- Toasts & Konfetti ---------- */
function toast(msg, type = 'info', iconName = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="toast-icon">${icon(iconName)}</div><div>${esc(msg)}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3200);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ['#7c6cff', '#3ec9ff', '#2fe39a', '#c8ff4d', '#ffb547', '#ff4d8d'];
  const parts = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * 0.35,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
    s: Math.random() * 7 + 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function frame(now) {
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 2200); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t < 2200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

function goalRow(goal) {
  const day = goal.week ? PLAN[goal.week - 1]?.days.find(d => /wings for life/i.test(d.name)) : null;
  const n = day ? diffDays(TODAY, day.date) : null;
  const when = day ? (n > 0 ? `in ${plural(n, 'Tag', 'Tagen')}` : n === 0 ? 'heute!' : 'geschafft') : 'nach dem Plan';
  return `<div class="goal">
    <div class="goal-icon">${icon(goal.icon)}</div>
    <div class="goal-main"><strong>${esc(goal.title)}</strong><span>${esc(goal.sub)}${goal.week ? ` · Woche ${goal.week}` : ''}</span></div>
    <span class="badge ${day && n <= 0 ? 's-done' : 's-upcoming'}">${esc(when)}</span>
  </div>`;
}

  if (!t) {
    const ended = planEnded();
    return `<div class="grid">${emptyState(ended ? 'trophy' : 'calendar',
      ended ? 'Dein Plan ist abgeschlossen' : 'Heute ist kein Training geplant',
      ended ? 'Glückwunsch! Sieh dir deine Statistiken an.' : `Dein Plan startet am ${fmtLong(PLAN_BEGIN)}.`,
      `<button class="btn btn-primary" data-route="${ended ? 'progress' : 'plan'}">${ended ? 'Fortschritt ansehen' : 'Plan ansehen'}</button>`)}</div>`;
  }
  const next = nextWorkout();
  const nextCard = `<section class="card span-4">
      <div class="card-head"><div class="card-title">${icon('flag')} Als Nächstes</div></div>
      ${next ? `<span class="next-when">${icon('clock', 'i-sm')} ${relDay(next.date)}</span><div class="next-title">${esc(next.name)}</div><p class="card-sub">${esc(next.focus || '')}</p>
        <button class="btn btn-ghost btn-block" style="margin-top:16px" data-action="open-day" data-day="${next.id}">Vorschau</button>`
      : '<p class="muted">Keine weiteren Workouts geplant.</p>'}
    </section>`;

  if (!isWorkout(t)) {
    const done = isDayDone(t);
    return `<div class="grid">
      <section class="card span-8">
        <div class="empty">
          <div class="empty-icon" style="background:rgba(54,214,195,.12);color:var(--recovery)">${icon(TYPE_META[t.type].icon)}</div>
          <div class="eyebrow">${fmtLong(t.date)}</div>
          <h3>${t.type === 'rest' ? 'Heute ist Ruhetag' : esc(t.name)}</h3>
          <p>${esc(t.description || 'Gönn deinem Körper die Erholung – hier passiert die Anpassung.')}</p>
          ${t.type === 'recovery' ? `<div class="actions"><button class="btn ${done ? 'btn-ghost' : 'btn-success'}" data-action="toggle-day" data-day="${t.id}">${icon('check', 'i-sm')} ${done ? 'Erledigt – rückgängig' : 'Regeneration erledigt'}</button></div>` : ''}
        </div>
      </section>
      ${nextCard}
    </div>`;
  }

  const done = isDayDone(t), prog = dayProgress(t);
  const doneEx = t.exercises.filter(isExDone).length;
  return `<div class="grid">
    <section class="card hero span-12 ${done ? 'done' : ''}">
      <div class="hero-content">
        <div class="eyebrow">${fmtLong(t.date)} · Woche ${t.weekIndex + 1}</div>
        <h2>${esc(t.name)}</h2>
        ${t.focus ? `<p class="lead">${esc(t.focus)}</p>` : ''}
        <div class="chips">
          <span class="chip">${icon('list')}${doneEx}/${t.exercises.length} Übungen</span>
          ${t.duration ? `<span class="chip">${icon('clock')}~${t.duration} min</span>` : ''}
          <span class="chip">${icon('layers')}${doneSets(t)}/${totalSets(t)} Sätze</span>
        </div>
        <div class="actions">
          ${done
            ? `<span class="badge s-done" style="padding:10px 16px;font-size:13px">${icon('check')}Training abgeschlossen</span>
               <button class="btn btn-ghost" data-action="toggle-day" data-day="${t.id}">Rückgängig</button>`
            : `<button class="btn btn-primary btn-lg" data-action="start-workout" data-day="${t.id}">${icon('play', 'i-sm')} ${prog > 0 ? 'Training fortsetzen' : 'Training starten'}</button>
               <button class="btn btn-ghost btn-lg" data-action="toggle-day" data-day="${t.id}">${icon('check', 'i-sm')} Schnell abhaken</button>`}
        </div>
      </div>
      <div class="hero-side">${ring(prog, { size: 180, stroke: 14, grad: done ? 'gradSuccess' : 'gradPrimary', label: `${pct(prog)}%`, sub: 'Fortschritt' })}</div>
    </section>

    <section class="card span-8">
      <div class="card-head">
        <div class="card-title">${icon('list')} Übungen</div>
        <button class="btn btn-ghost" data-action="open-day" data-day="${t.id}">Bearbeiten</button>
      </div>
      <div class="ex-list">
        ${t.exercises.map(ex => `
          <div class="ex-row ${isExDone(ex) ? 'is-done' : ''}">
            <button class="check sm ${isExDone(ex) ? 'checked' : ''} ${ui.lastToggled === ex.id ? 'pop' : ''}" data-action="toggle-ex" data-ex="${ex.id}" aria-label="${esc(ex.name)} abhaken">${icon('check')}</button>
            <div class="ex-row-main"><strong>${esc(ex.name)}</strong><span>${exTarget(ex)}</span></div>
            <span class="ex-row-sets">${setsDone(ex)}/${ex.sets}</span>
          </div>`).join('')}
      </div>
    </section>

    <div class="span-4" style="display:flex;flex-direction:column;gap:20px">
      <section class="card">
        <div class="card-head"><div class="card-title">${icon('timer')} Pausentimer</div></div>
        ${timerWidget(200, true)}
      </section>
      ${nextCard}
    </div>
  </div>`;
}

/* ---------- Trainingsplan ---------- */
function viewPlan() {
  if (!PLAN.length) return `<div class="grid">${emptyState('calendar', 'Noch kein Trainingsplan', 'Füge deinen Plan im Code ein – die Wochen erscheinen dann automatisch hier.')}</div>`;
  const wi = clamp(ui.selectedWeek, 0, PLAN.length - 1), w = PLAN[wi], ws = weekStats(w), cur = currentWeekIndex();
  const start = w.days[0]?.date || addDays(PLAN_START, wi * 7), end = addDays(PLAN_START, wi * 7 + 6);
  return `
  <div class="week-tabs-wrap">
    <div class="week-tabs" role="tablist" id="weekTabs">
      ${PLAN.map((wk, i) => `<button role="tab" aria-selected="${i === wi}" class="week-tab ${i === wi ? 'active' : ''} ${i === cur && !planNotStarted() && !planEnded() ? 'current' : ''}" data-action="select-week" data-week="${i}">
        <span>Woche ${i + 1}</span><i class="wt-bar"><b style="width:${pct(weekStats(wk).progress)}%"></b></i></button>`).join('')}
    </div>
  </div>
  <div class="grid">
    <section class="card span-12">
      <div class="week-head">
        <div style="display:flex;gap:22px;align-items:center">
          ${ring(ws.progress, { size: 96, stroke: 9, grad: 'gradSuccess', label: `${pct(ws.progress)}%` })}
          <div>
            <div class="eyebrow">Woche ${wi + 1} von ${PLAN.length} · ${fmtDate(start)} – ${fmtDate(end, { day: '2-digit', month: '2-digit', year: 'numeric' })}</div>
            <h2>${esc(w.title || `Woche ${wi + 1}`)}</h2>
            <div class="chips" style="margin-top:8px">
              ${w.phase ? `<span class="chip">${icon('layers')}${esc(w.phase)}</span>` : ''}
              ${w.focus ? `<span class="chip">${icon('target')}${esc(w.focus)}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="week-kpis">
          <div class="kpi"><strong>${ws.done}/${ws.training}</strong><span>Trainings</span></div>
          <div class="kpi"><strong>${ws.workoutsDone - ws.done}</strong><span>Optional erledigt</span></div>
          <div class="kpi"><strong>${ws.sets}/${ws.plannedSets}</strong><span>Sätze</span></div>
        </div>
        <div class="nav-arrows">
          <button class="icon-btn" data-action="week-step" data-dir="-1" ${wi === 0 ? 'disabled style="opacity:.35"' : ''} aria-label="Vorherige Woche">${icon('left')}</button>
          <button class="icon-btn" data-action="week-step" data-dir="1" ${wi === PLAN.length - 1 ? 'disabled style="opacity:.35"' : ''} aria-label="Nächste Woche">${icon('right')}</button>
        </div>
      </div>
    </section>
    <div class="span-12 day-grid">
      ${w.days.map((d, i) => dayCard(d, i)).join('')}
    </div>
  </div>`;
}

function dayCard(d, i) {
  const st = dayStatus(d), prog = dayProgress(d), isToday = cmpDay(d.date, TODAY) === 0;
  const sub = d.focus || d.description || '';
  return `<button class="day-card t-${d.type} ${st === 'done' ? 's-done-card' : ''} ${isToday ? 'is-today' : ''}" data-action="open-day" data-day="${d.id}" style="--i:${i}">
    <div class="day-top">
      <div><span class="day-name">${d.day}</span><span class="day-date">${fmtDate(d.date)}</span></div>
      ${statusBadge(isToday && st !== 'done' ? 'today' : st)}
    </div>
    <div class="day-icon">${icon(TYPE_META[d.type].icon)}</div>
    <h3>${esc(d.name)}</h3>
    ${sub ? `<p>${esc(sub)}</p>` : ''}
    <div class="day-meta">
      ${d.exercises.length ? `<span>${icon('list')}${d.exercises.length} Übungen</span>` : `<span>${icon(TYPE_META[d.type].icon)}${TYPE_META[d.type].label}</span>`}
      ${d.duration ? `<span>${icon('clock')}${d.duration} min</span>` : ''}
    </div>
    ${d.exercises.length ? bar(prog, `thin ${st === 'done' ? 'success' : ''}`) : ''}
  </button>`;
}

/* ---------- Fortschritt ---------- */
function viewProgress() {
  if (!PLAN.length) return `<div class="grid">${emptyState('chart', 'Keine Daten', 'Sobald ein Plan hinterlegt ist, erscheinen hier deine Statistiken.')}</div>`;
  const g = globalStats(), wi = currentWeekIndex(), ws = weekStats(PLAN[wi]);
  const weeks = PLAN.map(w => weekStats(w));
  const labels = PLAN.map((_, i) => `W${i + 1}`);

  // Geplante Gewichtsprogression der gewählten Übung (über alle Varianten hinweg) pro Woche
  // Eingetragene Gewichte (nur eigene Einträge) der gewählten Übung pro Woche
  const keys = WEIGHT_KEYS.filter(k => Object.values(EX_BY_ID).some(e => e.wkey === k.key));
  const exKey = keys.some(k => k.key === ui.progressExercise) ? ui.progressExercise : keys[0]?.key;
  const planVals = PLAN.map(w => {
    const vals = w.days.flatMap(d => d.exercises).filter(e => e.wkey === exKey).map(ownWeight).filter(Boolean);
    return vals.length ? Math.max(...vals) : null;
  });

  return `<div class="grid">
    <div class="span-12 rings-row">
      <section class="card ring-card lift">${ring(g.planProgress, { size: 130, stroke: 11, label: `${count(pct(g.planProgress))}%` })}<div><h3>Planfortschritt</h3><p>${g.doneTraining}/${g.totalTraining} Trainings</p></div></section>
      <section class="card ring-card lift">${ring(ws.progress, { size: 130, stroke: 11, grad: 'gradSuccess', label: `${count(pct(ws.progress))}%` })}<div><h3>Wochenfortschritt</h3><p>Woche ${wi + 1}: ${ws.done}/${ws.training}</p></div></section>
      <section class="card ring-card lift">${ring(g.consistency ?? 0, { size: 130, stroke: 11, grad: 'gradRecovery', label: g.consistency === null ? '–' : `${count(pct(g.consistency))}%` })}<div><h3>Konsistenz</h3><p>${g.missed} verpasst</p></div></section>
      <section class="card ring-card lift">${ring(g.totalWorkouts ? g.workoutsDone / g.totalWorkouts : 0, { size: 130, stroke: 11, grad: 'gradWarm', label: count(g.workoutsDone) })}<div><h3>Workouts</h3><p>inkl. optionaler Einheiten</p></div></section>
    </div>

    ${measureCard()}
    ${testsCard()}

    <section class="card span-6">
      <div class="card-head"><div><div class="card-title">${icon('dumbbell')} Absolvierte Workouts</div><div class="card-sub">Pflicht-Trainings pro Woche</div></div>
      <div class="chart-legend"><span><i style="background:var(--grad-primary)"></i>Erledigt</span><span><i style="background:rgba(255,255,255,.1)"></i>Geplant</span></div></div>
      ${barChart(weeks.map((s, i) => ({ label: labels[i], value: s.done, max: s.training, highlight: i === wi })))}
    </section>

    <section class="card span-6">
      <div class="card-head"><div><div class="card-title">${icon('layers')} Absolvierte Sätze</div><div class="card-sub">Pro Woche · gesamt ${num(g.sets, 0)} Sätze</div></div>
      <div class="chart-legend"><span><i style="background:#2fe39a"></i>Ist</span><span><i style="background:#7c6cff;opacity:.6"></i>Plan</span></div></div>
      ${lineChart(labels, [
        { name: 'Plan', values: weeks.map(s => s.plannedSets || null), color: '#7c6cff', dashed: true },
        { name: 'Ist', values: weeks.map((s, i) => (i <= wi || s.sets) ? s.sets : null), color: '#2fe39a', area: 'areaSuccess' }
      ], { fmt: v => num(v, 0), zero: true, highlight: wi })}
    </section>

    <section class="card span-8">
      <div class="card-head">
        <div><div class="card-title">${icon('trend')} Gewichtsprogression</div><div class="card-sub">Deine eingetragenen Gewichte pro Woche (Kurzhanteln: pro Hantel)</div></div>
        <select class="input select-ex" id="progressExercise" aria-label="Übung wählen">
          ${keys.map(k => `<option value="${k.key}" ${k.key === exKey ? 'selected' : ''}>${esc(k.label)}</option>`).join('')}
        </select>
      </div>
      ${lineChart(labels, [
        { name: 'Dein Gewicht', values: planVals, color: '#3ec9ff', area: 'areaPrimary' }
      ], { fmt: v => num(v, 1) + ' kg', highlight: wi, empty: 'Noch kein Gewicht eingetragen – trag im Training bei der Übung „Dein Gewicht“ ein.' })}
    </section>

    <section class="card span-4">
      <div class="card-head"><div class="card-title">${icon('calendar')} Wochenfortschritt</div></div>
      <div class="week-bars">
        ${weeks.map((s, i) => `<div class="week-bar-row ${i === wi ? 'current' : ''}" data-action="goto-week" data-week="${i}" role="button" tabindex="0">
          <span class="wl">Woche ${i + 1}</span>${bar(s.progress, s.progress >= 1 ? 'success' : '')}<span class="wv">${pct(s.progress)}%</span></div>`).join('')}
      </div>
    </section>

    <section class="card span-12">
      <div class="card-head"><div><div class="card-title">${icon('activity')} Trainingskonsistenz</div><div class="card-sub">Jeder Tag deines Plans auf einen Blick – klicke für Details</div></div>
      <div class="kpi" style="text-align:right"><strong>${num(g.sets, 0)}</strong><span>Sätze absolviert</span></div></div>
      <div class="hscroll">${heatmap()}</div>
    </section>
  </div>`;
}

/* ---------- Messwerte & Tests (Fortschritt) ---------- */
const TESTS = [
  { id: 'chair', label: 'Aufstehen vom Stuhl', unit: 'Wdh. in 30 s', mode: 'decimal' },
  { id: 'floor', label: 'Aufstehen vom Boden', unit: 'Stufe 1–6', mode: 'numeric' },
  { id: 'plank', label: 'Unterarmstütz (Knie)', unit: 'Sekunden', mode: 'numeric' },
  { id: 'run', label: '3 km Lauf-Geh', unit: 'Zeit mm:ss', mode: 'text' },
  { id: 'goblet', label: 'Goblet Squat 10 Wdh.', unit: 'kg', mode: 'decimal' }
];
const TEST_WEEK_NUMS = PLAN.map((w, i) => w.test ? i + 1 : null).filter(Boolean);
const parseNum = v => { const n = parseFloat(String(v ?? '').trim().replace(',', '.')); return Number.isFinite(n) ? n : null; };

function weightChart() {
  const vals = PLAN.map((_, i) => state.measure[i]?.weight ?? null);
  const first = vals.findIndex(v => v !== null);
  // Zielkorridor: ca. 0,4 kg pro Woche, höchstens 10 kg
  const target = first < 0 ? vals.map(() => null)
    : vals.map((_, i) => i < first ? null : Math.round((vals[first] - Math.min(10, 0.4 * (i - first))) * 10) / 10);
  return lineChart(PLAN.map((_, i) => `W${i + 1}`), [
    { name: 'Ziel (−0,4 kg/Woche)', values: target, color: '#7c6cff', dashed: true },
    { name: 'Gewicht', values: vals, color: '#2fe39a', area: 'areaSuccess' }
  ], { fmt: v => num(v, 1) + ' kg', highlight: currentWeekIndex(), empty: 'Trage dein Gewicht ein, um den Verlauf zu sehen.' });
}

function measureCard() {
  const wi = clamp(ui.measureWeek ?? currentWeekIndex(), 0, PLAN.length - 1);
  const m = state.measure[wi] || {};
  const field = (k, label, unit) => `<label class="field"><span>${label}</span>
    <div class="unit-input"><input class="input" type="text" inputmode="decimal" autocomplete="off" value="${m[k] != null ? num(m[k], 1) : ''}" data-m="${k}" data-week="${wi}" placeholder="–"><em>${unit}</em></div></label>`;
  return `<section class="card span-12">
    <div class="card-head">
      <div><div class="card-title">${icon('activity')} Körpergewicht & Umfang</div>
      <div class="card-sub">Gewicht jede Woche am gleichen Tag, morgens nach dem Aufstehen. Bauch (Nabelhöhe) und Hüfte einmal im Monat.</div></div>
      <select class="input select-week" id="measureWeek" aria-label="Woche wählen">
        ${PLAN.map((w, i) => `<option value="${i}" ${i === wi ? 'selected' : ''}>Woche ${i + 1} · ${fmtDate(w.days[0]?.date || addDays(PLAN_START, i * 7))}</option>`).join('')}
      </select>
    </div>
    <div class="measure-grid">
      ${field('weight', 'Gewicht', 'kg')}${field('waist', 'Bauchumfang', 'cm')}${field('hip', 'Hüftumfang', 'cm')}
    </div>
    <div id="weightChart" style="margin-top:18px">${weightChart()}</div>
    <p class="card-sub" style="margin-top:10px">Realistisch sind etwa 0,4 kg pro Woche. Die Waage schwankt – entscheidend ist der Trend über einen Monat.</p>
  </section>`;
}

function testsCard() {
  return `<section class="card span-12">
    <div class="card-head"><div><div class="card-title">${icon('award')} Tests</div>
    <div class="card-sub">In den Test-Wochen ${TEST_WEEK_NUMS.join(', ')} eintragen und vergleichen.</div></div></div>
    <div class="hscroll"><table class="test-table">
      <thead><tr><th>Test</th>${TEST_WEEK_NUMS.map(n => `<th>Woche ${n}</th>`).join('')}</tr></thead>
      <tbody>${TESTS.map(t => `<tr><td><strong>${esc(t.label)}</strong><span>${esc(t.unit)}</span></td>${TEST_WEEK_NUMS.map(n =>
        `<td><input class="input" type="text" inputmode="${t.mode}" autocomplete="off" value="${esc(state.tests[n]?.[t.id] ?? '')}" data-t="${t.id}" data-tw="${n}" placeholder="–" aria-label="${esc(t.label)} Woche ${n}"></td>`).join('')}</tr>`).join('')}
      </tbody>
    </table></div>
  </section>`;
}

    </section>
  </div>`;

/* ---------- Einstellungen ---------- */
function viewSettings() {
  // Letztes eingetragenes Gewicht je Übung (chronologisch)
  const latest = {};
  ALL_DAYS.forEach(d => d.exercises.forEach(ex => { const w = ex.wkey && ownWeight(ex); if (w) latest[ex.wkey] = { w, date: d.date, ex }; }));
  const hints = {};
  ALL_DAYS.forEach(d => d.exercises.forEach(ex => { if (ex.wkey && !hints[ex.wkey]) hints[ex.wkey] = ex.hint; }));
  const rows = WEIGHT_KEYS.map(k => {
    const l = latest[k.key];
    return `<div class="wrow">
      <div class="wrow-main"><strong>${esc(k.label)}</strong><span>${l ? `Zuletzt ${fmtDate(l.date, { weekday: 'short', day: '2-digit', month: '2-digit' })}` : `Vorschlag laut Plan: ${esc(hints[k.key] || '–')}`}</span></div>
      <span class="wval ${l ? '' : 'muted'}">${l ? `${num(l.w, 2)} kg${k.perHand ? ' <small>pro Hantel</small>' : ''}` : 'noch offen'}</span>
    </div>`;
  }).join('');

  return `<div class="grid">
    <section class="card span-12">
      <div class="card-head">
        <div><div class="card-title">${icon('dumbbell')} Deine Gewichte</div>
        <div class="card-sub">Das Gewicht trägst du direkt im Training bei jeder Übung ein („Dein Gewicht“). Beim nächsten Mal wird es automatisch übernommen – erhöhe es selbst, wenn alle Sätze sauber gehen und es sich leichter anfühlt als das Ziel-RPE (1–2 kg, Beine 2–4 kg).</div></div>
      </div>
      <div class="wlist">${rows}</div>
    </section>
    <section class="card span-12">
      <div class="card-head"><div><div class="card-title">${icon('info')} Daten</div>
      <div class="card-sub">Dein Fortschritt wird nur auf diesem Gerät im Browser gespeichert.</div></div></div>
      <div class="actions">
        <button class="btn btn-danger" data-action="reset-all">${icon('trash', 'i-sm')} Fortschritt zurücksetzen</button>
      </div>
    </section>
  </div>`;
}


/* =======================================================================
   3.10 WORKOUT-MODAL
   ======================================================================= */
function openModal(dayId) {
  if (!DAY_BY_ID[dayId]) return;
  ui.modalDayId = dayId;
  const root = $('#modalRoot');
  renderModal();
  root.classList.add('open');
  root.setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  $('#modal').scrollTop = 0;
  const body = $('.modal-body', root); if (body) body.scrollTop = 0;
}
function closeModal() {
  if (!ui.modalDayId) return;
  ui.modalDayId = null;
  const root = $('#modalRoot');
  root.classList.remove('open');
  root.setAttribute('aria-hidden', 'true');
  if (!ui.focus) document.body.classList.remove('locked');
  renderView(false);
}

function renderModal() {
  const d = DAY_BY_ID[ui.modalDayId]; if (!d) return;
  const modal = $('#modal');
  const scroll = $('.modal-body', modal)?.scrollTop || 0;
  const st = dayStatus(d), done = isDayDone(d), prog = dayProgress(d);
  const idx = ALL_DAYS.indexOf(d);
  const isToday = cmpDay(d.date, TODAY) === 0;

  modal.innerHTML = `
    <header class="modal-head">
      <div class="modal-head-row">
        <div style="min-width:0">
          <div class="eyebrow">Woche ${d.weekIndex + 1} · ${d.day}, ${fmtDate(d.date)} · ${relDay(d.date)}</div>
          <h2 id="modalTitle">${esc(d.name)}</h2>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="icon-btn" data-action="modal-step" data-dir="-1" ${idx <= 0 ? 'disabled style="opacity:.35"' : ''} aria-label="Vorheriger Tag">${icon('left')}</button>
          <button class="icon-btn" data-action="modal-step" data-dir="1" ${idx >= ALL_DAYS.length - 1 ? 'disabled style="opacity:.35"' : ''} aria-label="Nächster Tag">${icon('right')}</button>
          <button class="icon-btn" data-action="close-modal" aria-label="Schließen">${icon('x')}</button>
        </div>
      </div>
      <div class="chips">
        <span class="chip">${icon(TYPE_META[d.type].icon)}${TYPE_META[d.type].label}</span>
        ${statusBadge(isToday && st !== 'done' ? 'today' : st)}
        ${d.focus ? `<span class="chip">${icon('target')}${esc(d.focus)}</span>` : ''}
        ${d.duration ? `<span class="chip">${icon('clock')}${d.duration} min</span>` : ''}
      </div>
      ${d.exercises.length ? `<div class="progress-line">${bar(prog, done ? 'success' : '')}<strong>${pct(prog)}%</strong></div>` : ''}
    </header>

    <div class="modal-body">
      ${d.description ? `<p class="text-2" style="margin-bottom:${d.exercises.length ? 16 : 0}px">${esc(d.description)}</p>` : ''}
      ${d.exercises.length ? `<div class="ex-list">${d.exercises.map(ex => exerciseCard(ex)).join('')}</div>`
        : d.type === 'rest' ? `<div class="empty"><div class="empty-icon">${icon('moon')}</div><h3>Ruhetag</h3><p>Keine Übungen geplant. Erholung ist Teil des Fortschritts.</p></div>` : ''}
    </div>

    <footer class="modal-foot">
      ${isCompletable(d) ? `<button class="btn ${done ? 'btn-ghost' : 'btn-success'}" data-action="toggle-day" data-day="${d.id}">${icon('check', 'i-sm')} ${done ? 'Als offen markieren' : 'Als erledigt markieren'}</button>` : '<span></span>'}
      ${d.exercises.length && !done ? `<button class="btn btn-primary" data-action="start-workout" data-day="${d.id}">${icon('play', 'i-sm')} ${prog > 0 ? 'Training fortsetzen' : 'Training starten'}</button>` : ''}
    </footer>`;
  const body = $('.modal-body', modal); if (body) body.scrollTop = scroll;
  ui.lastToggled = null;
}

function specGrid(ex, cls = '') {
  const kind = unitKind(ex);
  const single = ex.sets === 1 && kind !== 'wdh';
  const label = ex.display ? 'Umfang'
    : single ? (kind === 'km' || kind === 'm' ? 'Strecke' : 'Dauer')
    : kind === 'min' ? 'Abschnitte' : kind === 'm' ? 'Runden × Meter' : `Sätze × ${kind === 'sek' ? 'Sek.' : 'Wdh.'}`;
  const tile = ([l, value]) => `<div class="spec"><span>${l}</span><strong>${esc(value)}</strong></div>`;
  return `<div class="specs ${cls}">${[
    [ex.suffix && !ex.display ? `${label} (${ex.suffix})` : label, ex.suffix && !ex.display ? fmtAmount({ ...ex, suffix: '' }) : fmtAmount(ex)],
    showsLoad(ex) ? ['Gewicht', ex.weight || ex.load ? fmtLoad(ex) : 'Körper­gewicht'] : null,
    ex.rest > 0 ? [ex.restLabel || 'Pause', fmtRest(ex)] : null,
    ex.rpe ? ['RPE', num(ex.rpe)] : null
  ].filter(Boolean).map(tile).join('')}</div>`;
}

// Eingabe "Dein Gewicht" bei Übungen mit Gewicht (Modal & Fokus-Modus)
function weightInput(ex) {
  if (!ex.wkey) return '';
  const own = ownWeight(ex), meta = WKEY[ex.wkey] || {};
  const step = LEG_KEYS.includes(ex.wkey) ? 'Beine: 2–4 kg' : '1–2 kg';
  const state_ = own ? 'Eingetragen.' : ex.weightSource === 'last' ? `Vom letzten Mal übernommen (${num(ex.weight, 2)} kg) – ändern oder so lassen.` : `Noch kein Gewicht eingetragen. Vorschlag laut Plan: ${esc(ex.hint)}.`;
  return `<div class="wlog">
    <div class="wlog-row">
      <span class="wlog-label">Dein Gewicht${meta.perHand ? ' <em>pro Hantel</em>' : ''}</span>
      <div class="wlog-box">
        <button class="icon-btn" data-action="wlog-step" data-ex="${ex.id}" data-dir="-1" aria-label="Gewicht verringern">−</button>
        <input class="input" type="text" inputmode="decimal" autocomplete="off" data-wlog="${ex.id}" value="${own ? num(own, 2) : ''}" placeholder="${ex.weight ? num(ex.weight, 2) : '–'}" aria-label="Gewicht ${esc(ex.name)} in kg">
        <span class="unit">kg</span>
        <button class="icon-btn" data-action="wlog-step" data-ex="${ex.id}" data-dir="1" aria-label="Gewicht erhöhen">+</button>
      </div>
    </div>
    <p class="wlog-hint">${state_} Alle Sätze sauber und leichter als RPE ${ex.rpe ? num(ex.rpe) : 'Ziel'}? Nächstes Mal mehr nehmen (${step}).</p>
  </div>`;
}

function setOwnWeight(exId, value) {
  const ex = EX_BY_ID[exId]; if (!ex) return;
  const s = ensureEx(ex.id);
  if (value > 0 && value <= 500) s.weight = Math.round(value * 100) / 100; else delete s.weight;
  applyOwnWeights();
  save();
}

function exerciseCard(ex) {
  const done = isExDone(ex), s = exStatus(ex), sd = setsDone(ex);
  return `<div class="ex ${done ? 'is-done' : ''}">
    <div class="ex-head">
      <button class="check ${done ? 'checked' : ''} ${ui.lastToggled === ex.id ? 'pop' : ''}" data-action="toggle-ex" data-ex="${ex.id}" aria-label="${esc(ex.name)} abhaken" aria-pressed="${done}">${icon('check')}</button>
      <div class="ex-title"><h4>${esc(ex.name)}</h4></div>
      <span class="badge ${s.cls}">${s.label}</span>
    </div>
    ${specGrid(ex)}
    ${weightInput(ex)}
    ${ex.notes ? `<div class="ex-plan-note">${icon('info')}<span>${esc(ex.notes)}</span></div>` : ''}
    <div class="sets-row"><span>${isCardio(ex) || ex.fixed ? (ex.sets === 1 ? 'Erledigt' : 'Abschnitte') : 'Sätze'} ${sd}/${ex.sets}</span>
      <div class="set-dots">${Array.from({ length: ex.sets }, (_, k) => `<button class="set-dot ${k < sd ? 'on' : ''}" data-action="set-sets" data-ex="${ex.id}" data-n="${k + 1}" aria-label="Satz ${k + 1}">${k + 1}</button>`).join('')}</div>
    </div>
  </div>`;
}


/* =======================================================================
   3.11 FOKUS-MODUS (geführtes Workout)
   ======================================================================= */
function openFocus(dayId) {
  const d = DAY_BY_ID[dayId]; if (!d || !d.exercises.length) return;
  if (ui.modalDayId) { ui.modalDayId = null; $('#modalRoot').classList.remove('open'); $('#modalRoot').setAttribute('aria-hidden', 'true'); }
  const first = d.exercises.findIndex(ex => !isExDone(ex));
  ui.focus = { dayId, exIndex: first < 0 ? 0 : first, startedAt: Date.now(), finished: false };
  const root = $('#focusRoot');
  renderFocus();
  root.classList.add('open');
  root.setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  root.scrollTop = 0;
}
function closeFocus() {
  if (!ui.focus) return;
  ui.focus = null;
  const root = $('#focusRoot');
  root.classList.remove('open');
  root.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
  renderView(true);
}

function renderFocus() {
  const f = ui.focus; if (!f) return;
  const d = DAY_BY_ID[f.dayId], root = $('#focusRoot');
  if (f.finished) { root.innerHTML = focusSummary(d); return; }

  const ex = d.exercises[f.exIndex], sd = setsDone(ex), done = isExDone(ex);
  const total = d.exercises.reduce((s, e) => s + e.sets, 0);
  const totalDone = d.exercises.reduce((s, e) => s + setsDone(e), 0);
  const allDone = d.exercises.every(isExDone);
  const isLast = f.exIndex === d.exercises.length - 1;

  root.innerHTML = `<div class="focus-shell">
    <header class="focus-head">
      <button class="icon-btn" data-action="close-focus" aria-label="Fokus-Modus verlassen">${icon('x')}</button>
      <div class="title"><div class="eyebrow">Woche ${d.weekIndex + 1} · ${d.day} · Fokus-Modus</div><h2>${esc(d.name)}</h2></div>
      <span class="focus-count">${totalDone}/${total} Sätze</span>
    </header>
    ${bar(totalDone / total, 'thick')}
    <nav class="focus-strip" aria-label="Übungen">
      ${d.exercises.map((e, i) => `<button class="fx-chip ${isExDone(e) ? 'done' : ''} ${i === f.exIndex ? 'active' : ''}" data-action="focus-goto" data-n="${i}">
        <span class="fx-num">${isExDone(e) ? icon('check') : i + 1}</span>${esc(e.name)}</button>`).join('')}
    </nav>

    <div class="focus-grid">
      <section class="card focus-card">
        <div class="eyebrow">Übung ${f.exIndex + 1} von ${d.exercises.length}</div>
        <h1>${esc(ex.name)}</h1>
        ${specGrid(ex, 'big')}
        ${weightInput(ex)}
        ${ex.notes ? `<div class="ex-plan-note">${icon('info')}<span>${esc(ex.notes)}</span></div>` : ''}

        ${ex.sets === 1 ? '<div style="height:18px"></div>' : `<div class="big-sets"><strong>${done ? ex.sets : Math.min(sd + 1, ex.sets)}</strong><span>/ ${ex.sets} ${isCardio(ex) || ex.fixed ? (done ? 'erledigt' : 'Abschnitt') : (done ? 'Sätze erledigt' : 'Satz')}</span></div>
        <div class="focus-sets">
          ${Array.from({ length: ex.sets }, (_, k) => `<button class="set-dot ${k < sd ? 'on' : ''}" data-action="set-sets" data-ex="${ex.id}" data-n="${k + 1}" aria-label="Satz ${k + 1}">${k < sd ? icon('check', 'i-sm') : k + 1}</button>`).join('')}
        </div>`}

        ${done
          ? (allDone
            ? `<button class="btn btn-success btn-lg btn-block" data-action="finish-workout">${icon('trophy', 'i-sm')} Workout abschließen</button>`
            : `<button class="btn btn-primary btn-lg btn-block" data-action="focus-next-open">Nächste Übung ${icon('right', 'i-sm')}</button>`)
          : `<button class="btn btn-primary btn-lg btn-block" data-action="complete-set" data-ex="${ex.id}">${icon('check', 'i-sm')} ${ex.sets === 1 ? 'Erledigt' : `${isCardio(ex) || ex.fixed ? 'Abschnitt' : 'Satz'} ${sd + 1} abschließen`}</button>`}
      </section>

      <aside class="card" style="padding:28px 20px">
        <div class="card-head" style="justify-content:center"><div class="card-title">${icon('timer')} Pause</div></div>
        ${timerWidget(230, true)}
      </aside>
    </div>

    <footer class="focus-foot">
      <button class="btn btn-ghost" data-action="focus-step" data-dir="-1" ${f.exIndex === 0 ? 'disabled' : ''}>${icon('left', 'i-sm')} Zurück</button>
      <button class="btn btn-ghost" data-action="finish-workout">${icon('flag', 'i-sm')} Beenden</button>
      <button class="btn btn-ghost" data-action="focus-step" data-dir="1" ${isLast ? 'disabled' : ''}>Weiter ${icon('right', 'i-sm')}</button>
    </footer>
  </div>`;
  updateTimerUI();
  ui.lastToggled = null;
}

function focusSummary(d) {
  const f = ui.focus;
  const mins = Math.max(1, Math.round((Date.now() - f.startedAt) / 60000));
  const sets = d.exercises.reduce((s, e) => s + setsDone(e), 0);
  return `<div class="focus-shell"><div class="finish">
    <div class="finish-badge">${icon('trophy')}</div>
    <div class="eyebrow">${esc(d.name)}</div>
    <h1>Workout abgeschlossen!</h1>
    <p class="text-2">Starke Arbeit. Dein Fortschritt wurde gespeichert – Zeit für Erholung, Protein und Schlaf.</p>
    <div class="finish-stats">
      <div class="card"><strong>${d.exercises.filter(isExDone).length}/${d.exercises.length}</strong><span>Übungen</span></div>
      <div class="card"><strong>${sets}</strong><span>Sätze</span></div>
      <div class="card"><strong>${d.exercises.reduce((s, e) => s + (unitKind(e) === 'wdh' && !e.display ? setsDone(e) * e.reps : 0), 0)}</strong><span>Wiederholungen</span></div>
      <div class="card"><strong>${mins} min</strong><span>Dauer</span></div>
    </div>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary btn-lg" data-action="close-focus">Zum Dashboard</button>
      <button class="btn btn-ghost btn-lg" data-action="summary-progress">Fortschritt ansehen</button>
    </div>
  </div></div>`;
}


/* =======================================================================
   3.12 TIMER
   ======================================================================= */
const timer = { duration: 90, remaining: 90, running: false, endAt: 0, interval: null, finished: false };
let audioCtx = null;

function timerWidget(size = 260, compact = false) {
  const stroke = compact ? 10 : 12, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<div class="timer-widget ${compact ? 'compact' : ''}" data-timer-widget>
    <div class="timer-ring" style="width:${size}px;max-width:100%;aspect-ratio:1/1;font-size:${size / 13}px">
      <svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"/>
        <circle class="ring-fg timer-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" stroke="url(#gradPrimary)"
          stroke-dasharray="${c}" stroke-dashoffset="0" data-timer-ring data-c="${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      </svg>
      <div class="timer-center"><span class="timer-text" data-timer-text role="timer">${fmtTime(timer.remaining)}</span><span class="timer-sub" data-timer-sub>Bereit</span></div>
    </div>
    <div class="timer-controls">
      <button class="icon-btn" data-action="timer-add" data-sec="-15" aria-label="15 Sekunden weniger">−15</button>
      <button class="btn-round" data-action="timer-toggle" data-timer-toggle aria-label="Start/Pause">${icon(timer.running ? 'pause' : 'play')}</button>
      <button class="icon-btn" data-action="timer-reset" aria-label="Zurücksetzen">${icon('reset', 'i-sm')}</button>
      <button class="icon-btn" data-action="timer-add" data-sec="15" aria-label="15 Sekunden mehr">+15</button>
    </div>
    <div class="presets">${[45, 60, 75, 90, 120].map(s => `<button class="preset" data-action="timer-preset" data-sec="${s}">${s}s</button>`).join('')}</div>
  </div>`;
}

function unlockAudio() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { /* Audio nicht verfügbar */ }
}
function beep() {
  if (!state.settings.sound) return;
  try {
    unlockAudio();
    const t0 = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach((dt, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.2);
    });
  } catch { /* ignorieren */ }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function timerStart() {
  unlockAudio();
  if (timer.remaining <= 0) timer.remaining = timer.duration;
  timer.finished = false;
  timer.running = true;
  timer.endAt = Date.now() + timer.remaining * 1000;
  clearInterval(timer.interval);
  timer.interval = setInterval(timerTick, 200);
  updateTimerUI();
}
function timerPause() {
  if (timer.running) timer.remaining = Math.max(0, (timer.endAt - Date.now()) / 1000);
  timer.running = false;
  clearInterval(timer.interval);
  updateTimerUI();
}
function timerReset() { timerPause(); timer.remaining = timer.duration; timer.finished = false; updateTimerUI(); }
function timerSet(sec, autostart = false) {
  timerPause();
  timer.duration = sec; timer.remaining = sec; timer.finished = false;
  if (autostart) timerStart(); else updateTimerUI();
}
function timerAdd(sec) {
  const cur = timer.running ? (timer.endAt - Date.now()) / 1000 : timer.remaining;
  const rem = Math.max(5, cur + sec);
  timer.duration = Math.max(5, timer.duration + sec, rem);
  if (timer.running) timer.endAt = Date.now() + rem * 1000;
  else { timer.remaining = rem; timer.finished = false; }
  updateTimerUI();
}
function timerTick() {
  timer.remaining = (timer.endAt - Date.now()) / 1000;
  if (timer.remaining <= 0) {
    timer.remaining = 0; timer.running = false; timer.finished = true;
    clearInterval(timer.interval);
    beep();
    toast('Pause vorbei – nächster Satz!', 'success', 'zap');
  }
  updateTimerUI();
}

// Aktualisiert alle Timer-Darstellungen (Widget(s), Topbar-Pille, Tab-Titel) ohne Re-Render
function updateTimerUI() {
  const rem = timer.running ? Math.max(0, (timer.endAt - Date.now()) / 1000) : timer.remaining;
  const ratio = timer.duration ? rem / timer.duration : 0;
  const text = fmtTime(rem);
  const sub = timer.finished ? 'Los geht’s!' : timer.running ? 'Pause läuft' : rem < timer.duration ? 'Pausiert' : 'Bereit';
  $$('[data-timer-text]').forEach(el => { el.textContent = text; });
  $$('[data-timer-sub]').forEach(el => { el.textContent = sub; });
  $$('[data-timer-ring]').forEach(el => { el.style.strokeDashoffset = (+el.dataset.c) * (1 - ratio); });
  $$('[data-timer-toggle]').forEach(el => { el.innerHTML = icon(timer.running ? 'pause' : 'play'); });
  $$('[data-timer-widget]').forEach(el => {
    el.classList.toggle('running', timer.running);
    el.classList.toggle('ending', timer.running && rem <= 10);
    el.classList.toggle('finished', timer.finished);
  });
  $$('.preset').forEach(el => el.classList.toggle('active', +el.dataset.sec === timer.duration));
  const pill = $('#timerPill');
  const active = timer.running || (rem > 0 && rem < timer.duration);
  pill.classList.toggle('show', active && ui.route !== 'timer');
  pill.classList.toggle('paused', !timer.running);
  document.title = timer.running ? `${text} · Pause – ${PLAN_CONFIG.appName}` : `${PLAN_CONFIG.appName} · ${PLAN_CONFIG.planName}`;
}


/* =======================================================================
   3.13 AKTIONEN & EVENTS
   ======================================================================= */
function setDayComplete(dayId, value, { markExercises = true, celebrate = true } = {}) {
  const d = DAY_BY_ID[dayId]; if (!d || !isCompletable(d)) return;
  const s = ensureDay(dayId);
  s.completed = value;
  s.completedAt = value ? new Date().toISOString() : null;
  if (value && markExercises) {
    d.exercises.forEach(ex => {
      if (isExDone(ex)) return;
      const e = ensureEx(ex.id); e.done = true; e.setsDone = ex.sets;
    });
  }
  save();
  if (value && celebrate) {
    if (isWorkout(d)) { confetti(); toast(`${d.name} abgeschlossen!`, 'success', 'trophy'); }
    else toast('Regeneration erledigt – gut gemacht!', 'success', 'leaf');
  }
}

// Synchronisiert den Tagesstatus mit den Übungen (alle erledigt => Tag erledigt)
function syncDay(d, { celebrate = true } = {}) {
  const all = d.exercises.length && d.exercises.every(isExDone);
  if (all && !isDayDone(d)) { setDayComplete(d.id, true, { markExercises: false, celebrate }); return true; }
  if (!all && isDayDone(d)) { ensureDay(d.id).completed = false; save(); }
  return false;
}

function refresh() {
  if (ui.focus) renderFocus();
  else if (ui.modalDayId) renderModal();
  else renderView(false);
  renderChrome();
}

const ACTIONS = {
  'open-day': el => openModal(el.dataset.day),
  'close-modal': () => closeModal(),
  'modal-step': el => {
    const i = ALL_DAYS.findIndex(d => d.id === ui.modalDayId) + (+el.dataset.dir);
    if (ALL_DAYS[i]) { ui.modalDayId = ALL_DAYS[i].id; renderModal(); $('.modal-body')?.scrollTo(0, 0); }
  },

  'toggle-ex': el => {
    const ex = EX_BY_ID[el.dataset.ex]; if (!ex) return;
    const s = ensureEx(ex.id);
    s.done = !s.done;
    s.setsDone = s.done ? ex.sets : 0;
    ui.lastToggled = ex.id;
    save();
    syncDay(DAY_BY_ID[ex.dayId]);
    refresh();
  },

  'set-sets': el => {
    const ex = EX_BY_ID[el.dataset.ex]; if (!ex) return;
    const s = ensureEx(ex.id);
    let n = +el.dataset.n;
    if (setsDone(ex) === n) n -= 1;          // erneuter Klick auf letzten Punkt = zurücknehmen
    s.setsDone = n;
    s.done = n >= ex.sets;
    save();
    const finished = syncDay(DAY_BY_ID[ex.dayId], { celebrate: !ui.focus });
    if (ui.focus && finished) { ui.focus.finished = true; confetti(); }
    refresh();
  },

  'toggle-day': el => {
    const d = DAY_BY_ID[el.dataset.day]; if (!d) return;
    setDayComplete(d.id, !isDayDone(d));
    refresh();
  },

  'start-workout': el => openFocus(el.dataset.day),
  'close-focus': () => closeFocus(),
  'summary-progress': () => { closeFocus(); navigate('progress'); },
  'focus-goto': el => { ui.focus.exIndex = +el.dataset.n; renderFocus(); },
  'focus-step': el => {
    const d = DAY_BY_ID[ui.focus.dayId];
    ui.focus.exIndex = clamp(ui.focus.exIndex + (+el.dataset.dir), 0, d.exercises.length - 1);
    renderFocus();
  },
  'focus-next-open': () => {
    const d = DAY_BY_ID[ui.focus.dayId];
    const n = d.exercises.length;
    for (let k = 1; k <= n; k++) {
      const i = (ui.focus.exIndex + k) % n;
      if (!isExDone(d.exercises[i])) { ui.focus.exIndex = i; break; }
    }
    renderFocus();
  },

  'complete-set': el => {
    const ex = EX_BY_ID[el.dataset.ex]; if (!ex) return;
    const s = ensureEx(ex.id);
    s.setsDone = Math.min(ex.sets, setsDone(ex) + 1);
    if (s.setsDone >= ex.sets) {
      s.done = true;
      toast(`${ex.name} erledigt`, 'success', 'check');
    }
    save();
    const d = DAY_BY_ID[ex.dayId];
    if (syncDay(d, { celebrate: false })) {
      ui.focus.finished = true;
      timerPause();
      confetti();
    } else {
      if (ex.rest > 0) timerSet(ex.rest, true);
      if (s.done) ACTIONS['focus-next-open']();
    }
    renderFocus();
  },

  'finish-workout': () => {
    const d = DAY_BY_ID[ui.focus.dayId];
    if (!d.exercises.every(isExDone) && !confirm('Noch nicht alle Übungen sind abgehakt. Workout trotzdem als erledigt markieren?')) return;
    setDayComplete(d.id, true, { markExercises: false, celebrate: false });
    ui.focus.finished = true;
    timerPause();
    confetti();
    renderFocus();
  },

  'select-week': el => { ui.selectedWeek = +el.dataset.week; renderView(false); scrollTabs(); },
  'week-step': el => { ui.selectedWeek = clamp(ui.selectedWeek + (+el.dataset.dir), 0, PLAN.length - 1); renderView(false); scrollTabs(); },
  'goto-week': el => { ui.selectedWeek = +el.dataset.week; navigate('plan'); },

  'timer-toggle': () => timer.running ? timerPause() : timerStart(),
  'timer-reset': () => timerReset(),
  'timer-preset': el => timerSet(+el.dataset.sec, true),
  'timer-add': el => timerAdd(+el.dataset.sec),
  'toggle-sound': el => {
    state.settings.sound = !state.settings.sound; save();
    el.classList.toggle('on', state.settings.sound);
    el.setAttribute('aria-checked', state.settings.sound);
    toast(state.settings.sound ? 'Signalton aktiviert' : 'Signalton deaktiviert', 'info', state.settings.sound ? 'volume' : 'mute');
  },

  'reset-all': () => {
    if (!confirm('Gesamten Trainingsfortschritt zurücksetzen? Dies kann nicht rückgängig gemacht werden.')) return;
    const fresh = freshState();
    fresh.meta = { seeded: true, autoStart: state.meta.autoStart };
    fresh.settings = state.settings;
    state = fresh; saveNow(); location.reload();
  },
  'load-demo': () => {
    if (!confirm('Fortschritt durch Demo-Daten ersetzen? Einstellungen bleiben erhalten.')) return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings: state.settings }));
    skipSave = true; location.reload();
  },

  'wlog-step': el => {
    const ex = EX_BY_ID[el.dataset.ex]; if (!ex) return;
    const cur = ownWeight(ex) || ex.weight || 0;
    const dir = +el.dataset.dir;
    const step = cur >= 20 ? 2.5 : 1;
    setOwnWeight(ex.id, cur === 0 && dir > 0 ? 1 : Math.max(0, cur + step * dir));
    refresh();
  }
};

function scrollTabs() {
  const tabs = $('#weekTabs'), active = $('.week-tab.active', tabs || document);
  if (tabs && active) tabs.scrollTo({ left: active.offsetLeft - tabs.clientWidth / 2 + active.clientWidth / 2, behavior: 'smooth' });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action], [data-route]');
  if (!el || el.disabled) return;
  if (el.dataset.action) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  } else if (el.dataset.route) {
    e.preventDefault();
    if (ui.modalDayId) closeModal();
    navigate(el.dataset.route);
  }
});

// Tastatur: Enter/Space für role="button"-Elemente, Escape schließt Overlays
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.focus) closeFocus(); else if (ui.modalDayId) closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'progressExercise') { ui.progressExercise = t.value; renderView(false); return; }
  if (t.id === 'measureWeek') { ui.measureWeek = +t.value; renderView(false); return; }
  if (t.dataset.m) {
    const wi = +t.dataset.week, v = parseNum(t.value);
    const m = (state.measure[wi] ||= {});
    if (v !== null && v > 0 && v < 1000) { m[t.dataset.m] = Math.round(v * 10) / 10; t.value = num(m[t.dataset.m], 1); }
    else { delete m[t.dataset.m]; t.value = ''; }
    if (!Object.keys(m).length) delete state.measure[wi];
    save();
    const chart = $('#weightChart'); if (chart) chart.innerHTML = weightChart();
    return;
  }
  if (t.dataset.t) {
    const n = t.dataset.tw, v = String(t.value).trim().slice(0, 20);
    const rec = (state.tests[n] ||= {});
    if (v) rec[t.dataset.t] = v; else delete rec[t.dataset.t];
    if (!Object.keys(rec).length) delete state.tests[n];
    save();
    return;
  }
  if (t.dataset.wlog) {
    const v = parseNum(t.value);
    setOwnWeight(t.dataset.wlog, v === null ? 0 : v);
    refresh();
  }
});


/* =======================================================================
   3.14 ROUTER, CHROME & INIT
   ======================================================================= */
function navigate(route) {
  if (!ROUTES[route]) route = 'dashboard';
  if (location.hash !== `#${route}`) location.hash = route;
  else { ui.route = route; renderView(true); }
}
// Beim Drehen des Handys / Ändern der Fensterbreite Diagramme passend neu zeichnen
let narrowNow = window.innerWidth < 720, resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const n = window.innerWidth < 720;
    if (n === narrowNow) return;
    narrowNow = n;
    if (!ui.focus && !ui.modalDayId && !document.activeElement?.matches('input, select, textarea')) renderView(false);
  }, 200);
});

window.addEventListener('hashchange', () => {
  const r = location.hash.slice(1);
  ui.route = ROUTES[r] ? r : 'dashboard';
  if (ui.focus) closeFocus();
  renderView(true);
  window.scrollTo(0, 0);
});

function renderView(animate = true) {
  ANIM = animate;
  const view = $('#view');
  view.classList.toggle('no-anim', !animate);
  if (animate) { view.style.animation = 'none'; void view.offsetWidth; view.style.animation = ''; }
  view.innerHTML = ROUTES[ui.route].render();
  $$('.card', view).forEach((c, i) => { if (!c.style.getPropertyValue('--i')) c.style.setProperty('--i', Math.min(i, 12)); });
  if (animate) { animateRings(view); animateCounts(view); }
  if (ui.route === 'plan') scrollTabs();
  ui.lastToggled = null;
  ANIM = true;
  renderChrome();
  updateTimerUI();
}

function renderChrome() {
  const r = ROUTES[ui.route];
  const hour = new Date().getHours();
  const greet = hour < 11 ? 'Guten Morgen' : hour < 18 ? 'Guten Tag' : 'Guten Abend';
  $('#viewTitle').textContent = ui.route === 'dashboard' ? `${greet}, ${PLAN_CONFIG.athlete}` : r.title;
  $('#topEyebrow').textContent = fmtLong(TODAY);

  const t = todayDay();
  const todayBadge = t && isWorkout(t) && !isDayDone(t) ? '<span class="nav-badge">1</span>' : '';
  $('#sideNav').innerHTML = `<div class="nav-label">Menü</div>` + Object.entries(ROUTES).map(([k, v]) =>
    `<a href="#${k}" class="nav-item ${k === ui.route ? 'active' : ''}" data-route="${k}" ${k === ui.route ? 'aria-current="page"' : ''}>${icon(v.icon)}<span>${v.title}</span>${k === 'today' ? todayBadge : ''}</a>`).join('');
  $('#bottomNav').innerHTML = Object.entries(ROUTES).map(([k, v]) =>
    `<a href="#${k}" class="bn-item ${k === ui.route ? 'active' : ''}" data-route="${k}">${icon(v.icon)}<span>${v.short}</span></a>`).join('');

  if (PLAN.length) {
    const g = globalStats(), wi = currentWeekIndex();
    $('#sideCard').innerHTML = `
      <div class="row"><span class="muted">Gesamtfortschritt</span><strong>${pct(g.planProgress)}%</strong></div>
      <div style="margin:10px 0 12px">${bar(g.planProgress)}</div>
      <div class="row"><span class="muted">Woche</span><span>${wi + 1} / ${PLAN.length}</span></div>
      <div class="row" style="margin-top:4px"><span class="muted">Serie</span><span>${icon('flame', 'i-sm')} ${g.streak}</span></div>`;
  }
}

function init() {
  $('#brandLogo').innerHTML = icon('zap');
  $('#brandName').textContent = PLAN_CONFIG.appName;
  $('#brandSub').textContent = PLAN_CONFIG.planName;
  $('#avatar').textContent = PLAN_CONFIG.athlete.split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
  $('#sideActions').innerHTML = `
    <button class="link-btn" data-action="reset-all" title="Fortschritt zurücksetzen">${icon('trash', 'i-sm')}<span>Fortschritt zurücksetzen</span></button>`;

  if (PLAN_CONFIG.seedDemoProgress && !state.meta.seeded) seedDemoProgress();

  const r = location.hash.slice(1);
  ui.route = ROUTES[r] ? r : 'dashboard';
  renderView(true);
}

init();
</script>
</body>
